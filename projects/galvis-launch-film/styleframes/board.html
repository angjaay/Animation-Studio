<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GALVIS Launch Film — Styleframes</title>
<style>
  body { margin: 0; padding: 40px 16px; background: #F5F6F8; color: #032750; font: 16px/1.5 Mulish, system-ui, sans-serif; }
  main { max-width: 1600px; margin: 0 auto; }
  h1 { font: 700 32px/1.2 "Plus Jakarta Sans", system-ui, sans-serif; margin: 0 0 8px; }
  header p { color: #324966; margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 640px), 1fr)); gap: 32px; }
  figure { margin: 0; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 4px rgba(3,39,80,.12); }
  img { display: block; width: 100%; height: auto; }
  figcaption { padding: 16px 20px 20px; display: grid; gap: 6px; }
  figcaption span { color: #667085; font-size: 14px; }
  figcaption p { margin: 0; color: #324966; }
  q { font-weight: 700; quotes: none; }
</style>
</head>
<body>
<main>
<header>
  <h1>GALVIS Launch Film — Styleframes</h1>
  <p>One key frame per act, rendered from the HyperFrames project at each act’s styleframe time. Spec: docs/superpowers/specs/2026-10-20-galvis-launch-film-design.md</p>
</header>
<div class="grid">
<figure>
  <img src="01-world.png" alt="Act 01 styleframe" />
  <figcaption>
    <b>01 · world</b>
    <span>0:00–0:12 · bars 1–6 · frame at 9.5s · Dark → light</span>
    <p>Dawn earth in the landing dither; SEA coastline and seeded signals on a perspective plane.</p>
    <q>EVERY LOCATION HOLDS INTELLIGENCE.</q>
  </figcaption>
</figure>
<figure>
  <img src="02-complexity.png" alt="Act 02 styleframe" />
  <figcaption>
    <b>02 · complexity</b>
    <span>0:12–0:24 · bars 7–12 · frame at 17s · Light</span>
    <p>Seven isometric data plates pile up into a muddle (imagery, terrain, environment, infrastructure, demography, boundaries, analytics).</p>
    <q>MORE DATA DOESN’T ALWAYS MEAN MORE CLARITY.</q>
  </figcaption>
</figure>
<figure>
  <img src="03-reveal.png" alt="Act 03 styleframe" />
  <figcaption>
    <b>03 · reveal</b>
    <span>0:24–0:34 · bars 13–17 · frame at 31s · Light</span>
    <p>The mark assembled from its anatomy — plates, hexagon, arrow — sharp, with keylines; leftover dither dust at the edges.</p>
    <q>GALVIS · Geospatial Intelligence Virtual Assistant System</q>
  </figcaption>
</figure>
<figure>
  <img src="04-core.png" alt="Act 04 styleframe" />
  <figcaption>
    <b>04 · core</b>
    <span>0:34–0:52 · bars 18–26 · frame at 51s · Dark</span>
    <p>Inside the hexagon: six modules wired to one core, each with a mini visual — one engine, not feature cards.</p>
    <q>GALVIS · CORE TECHNOLOGY</q>
  </figcaption>
</figure>
<figure>
  <img src="05-products.png" alt="Act 05 styleframe" />
  <figcaption>
    <b>05 · products</b>
    <span>0:52–1:02 · bars 27–31 · frame at 61s · Dark</span>
    <p>The arrow’s thread splits into three branches in the sub-brand colours; particles flow from the one core.</p>
    <q>WORKSPACE · DATA ENRICHMENT · ENTERPRISE</q>
  </figcaption>
</figure>
<figure>
  <img src="06-workspace.png" alt="Act 06 styleframe" />
  <figcaption>
    <b>06 · workspace</b>
    <span>1:02–1:16 · bars 32–38 · frame at 73s · Light</span>
    <p>Reconstructed GALVIS Workspace: agent plan running, suitability surface painted over Riau.</p>
    <q>UNDERSTAND</q>
  </figcaption>
</figure>
<figure>
  <img src="07-enrichment.png" alt="Act 07 styleframe" />
  <figcaption>
    <b>07 · enrichment</b>
    <span>1:16–1:30 · bars 39–45 · frame at 83s · Light</span>
    <p>One polygon enriched by ten attribute maps from gisact.io; the last cells are still raw (dithered).</p>
    <q>Turn Location Into Intelligence</q>
  </figcaption>
</figure>
<figure>
  <img src="08-enterprise.png" alt="Act 08 styleframe" />
  <figcaption>
    <b>08 · enterprise</b>
    <span>1:30–1:46 · bars 46–53 · frame at 97s · Light</span>
    <p>Sector strip: the scan beam resolves raw data into a forest-fire risk layer; reconstructed label and legend.</p>
    <q>Forestry · Forest Monitoring → Disturbance Detection → Conservation Intelligence</q>
  </figcaption>
</figure>
<figure>
  <img src="09-reunify.png" alt="Act 09 styleframe" />
  <figcaption>
    <b>09 · reunify</b>
    <span>1:46–1:52 · bars 54–56 · frame at 111s · Light → dark</span>
    <p>Everything returns to the core and becomes a map of active intelligence nodes in the three product colours.</p>
    <q>ONE CORE.</q>
  </figcaption>
</figure>
<figure>
  <img src="10-final.png" alt="Act 10 styleframe" />
  <figcaption>
    <b>10 · final</b>
    <span>1:52–2:00 · bars 57–60 · frame at 117s · Dark</span>
    <p>Reverse lockup over the dawn dither, as on galvis.io.</p>
    <q>SEE MORE. UNDERSTAND BETTER. DECIDE SMARTER.</q>
  </figcaption>
</figure>
</div>
</main>
</body>
</html>
