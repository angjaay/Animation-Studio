<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act05-products-root { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }
        #act05-products-glow { position: absolute; inset: 0; background: radial-gradient(ellipse 900px 520px at 960px 360px, rgba(2, 74, 188, 0.5), rgba(3, 39, 80, 0)); }
        #act05-products-net { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        #act05-products-mark { position: absolute; left: 905px; top: 90px; width: 110px; height: 121px; filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.45)); }
        #act05-products-mark > div { position: absolute; inset: 0; }
        #act05-products-mark svg { width: 100%; height: 100%; display: block; }
        #act05-products-core {
          position: absolute; left: 0; right: 0; top: 268px; text-align: center;
          font-family: var(--font-text); font-weight: 700; font-size: 22px; letter-spacing: 0.3em; padding-left: 0.3em; color: var(--cool-gray);
        }
        #act05-products-flow { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        .act05-products-say {
          position: absolute; left: 0; right: 0; top: 730px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 60px; letter-spacing: 0.04em; color: var(--white);
        }
        .act05-products-lockup { position: absolute; top: 858px; width: 460px; margin-left: -230px; text-align: center; }
        .act05-products-lockup b {
          display: block; font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: 0.06em; color: var(--white);
        }
        .act05-products-lockup i { display: block; width: 120px; height: 4px; margin: 14px auto 0; border-radius: 2px; }
      </style>
      <div id="act05-products-root" data-composition-id="act05-products" data-width="1920" data-height="1080">
        <div id="act05-products-glow"></div>
        <svg id="act05-products-net" viewBox="0 0 1920 1080"></svg>
        <div id="act05-products-mark"></div>
        <canvas id="act05-products-flow" width="1920" height="1080"></canvas>
        <div id="act05-products-core"></div>
        <div id="act05-products-one" class="act05-products-say"></div>
        <div id="act05-products-three" class="act05-products-say"></div>
      </div>
      <script>
        GV.register('act05-products', async (tl) => {
          const id = 'act05-products';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          $('one').textContent = GV.COPY['products.one'];
          $('three').textContent = GV.COPY['products.three'];
          const root = document.getElementById(`${id}-root`);
          document.getElementById(`${id}-core`).textContent = GV.COPY['core.label'];

          const mount = (host, prefix) => {
            const parts = GV.logoParts(prefix);
            for (const key of ['hexagon', 'arrow', 'plates']) {
              const layer = document.createElement('div');
              layer.innerHTML = parts[key];
              host.append(layer);
            }
          };
          mount(document.getElementById(`${id}-mark`), `${id}-main`);

          const SPLIT = [960, 560];
          const ENDS = [[420, 820], [960, 820], [1500, 820]];
          const BRANCHES = [
            ['products.workspace', '#024ABC'],
            ['products.enrichment', '#1FAFA1'],
            ['products.enterprise', '#86C36A'],
          ];
          const geo = GV.branchGeometry({ top: [960, 318], split: SPLIT, ends: ENDS });

          const defs = BRANCHES.map(([, color], i) =>
            `<linearGradient id="${id}-g${i}" gradientUnits="userSpaceOnUse" x1="${SPLIT[0]}" y1="${SPLIT[1]}" x2="${ENDS[i][0]}" y2="${ENDS[i][1]}">` +
            `<stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="${color}"/></linearGradient>`).join('');
          const glow = `<filter id="${id}-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
          let net = `<defs>${defs}${glow}</defs>`;
          net += `<path d="${geo.trunk}" stroke="#FFFFFF" stroke-width="3" fill="none" filter="url(#${id}-glow)"/>`;
          net += geo.branches.map((d, i) => `<path d="${d}" stroke="url(#${id}-g${i})" stroke-width="3" fill="none" filter="url(#${id}-glow)"/>`).join('');
          net += `<circle cx="${SPLIT[0]}" cy="${SPLIT[1]}" r="7" fill="#FFFFFF" filter="url(#${id}-glow)"/>`;
          net += ENDS.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="9" fill="${BRANCHES[i][1]}" stroke="#FFFFFF" stroke-width="2"/>`).join('');
          const svg = document.getElementById(`${id}-net`);
          svg.innerHTML = net;

          // Particles riding the trunk and each branch, always downward: all three draw from one core.
          // Positions come from time alone, so any frame can be rendered on its own.
          const paths = [...svg.querySelectorAll('path')];
          const lens = paths.map((p) => p.getTotalLength());
          const rnd = GV.seeded(5);
          const riders = paths.flatMap((_, i) => Array.from({ length: 14 }, () => ({ i, phase: rnd(), speed: 0.35 + rnd() * 0.3, r: 1.5 + rnd() * 2.2, a: 0.5 + rnd() * 0.5 })));
          const fctx = $('flow').getContext('2d');
          const drawFlow = (t) => {
            fctx.clearRect(0, 0, 1920, 1080);
            const on = Math.min(1, Math.max(0, (t - A(29, 3)) / 0.5));
            if (!on) return;
            for (const p of riders) {
              const u = (p.phase + t * p.speed) % 1;
              const pt = paths[p.i].getPointAtLength(u * lens[p.i]);
              fctx.globalAlpha = p.a * on;
              fctx.fillStyle = '#FFFFFF';
              fctx.beginPath(); fctx.arc(pt.x, pt.y, p.r, 0, Math.PI * 2); fctx.fill();
            }
          };
          const clock = { t: 0 };
          tl.to(clock, { t: 10, duration: 10, ease: 'none', onUpdate: () => drawFlow(clock.t) }, 0);

          const lockups = [];
          for (const [i, [key, color]] of BRANCHES.entries()) {
            const lock = document.createElement('div');
            lock.className = `${id}-lockup`;
            lock.style.left = `${ENDS[i][0]}px`;
            const name = document.createElement('b');
            name.textContent = GV.COPY[key];
            const bar = document.createElement('i');
            bar.style.background = color;
            lock.append(name, bar);
            root.append(lock);
            lockups.push(lock);
          }

          // Bar 27-28: one core, three ways — the mark holds the centre, then rises to its place.
          gsap.set($('mark'), { y: 360, scale: 1.6 });
          tl.to($('mark'), { y: 0, scale: 1, duration: 1.6, ease: 'power3.inOut' }, A(28));
          const say = (el, inAt, outAt) => {
            gsap.set(el, { opacity: 0, y: 24 });
            tl.to(el, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, inAt);
            tl.to(el, { opacity: 0, duration: 0.3 }, outAt);
          };
          say($('one'), A(27), A(27, 3));
          say($('three'), A(28), A(28, 3));
          gsap.set($('core'), { opacity: 0 });
          tl.to($('core'), { opacity: 1, duration: 0.4 }, A(28, 3));

          // Bar 29 (impact): the trunk draws down, then splits into three branches.
          const [trunk, ...branches] = paths;
          paths.forEach((p, i) => gsap.set(p, { strokeDasharray: lens[i], strokeDashoffset: lens[i] }));
          tl.to(trunk, { strokeDashoffset: 0, duration: 0.6, ease: 'power2.in' }, A(29));
          tl.to(branches, { strokeDashoffset: 0, duration: 1.0, ease: 'power2.out' }, A(29) + 0.4);
          const circles = svg.querySelectorAll('circle');
          gsap.set(circles, { opacity: 0, scale: 0, transformOrigin: '50% 50%' });
          tl.to(circles[0], { opacity: 1, scale: 1.6, duration: 0.25, ease: 'back.out(3)' }, A(29) + 0.4);
          tl.to(circles[0], { scale: 1, duration: 0.4 }, A(29) + 0.65);
          tl.to([...circles].slice(1), { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2)' }, A(29) + 1.3);

          // Bar 30: the three names land with the three notes of the sonic logo.
          gsap.set(lockups, { opacity: 0, y: 20 });
          lockups.forEach((lock, k) => tl.to(lock, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, A(30, k)));
        }, 10);
      </script>
    </template>
  </body>
</html>
