<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act02-complexity-root { position: absolute; inset: 0; overflow: hidden; background: var(--light-gray); }
        .act02-complexity-line {
          position: absolute; left: 0; right: 0; top: 84px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 56px; letter-spacing: 0.02em; color: var(--navy);
        }
        #act02-complexity-stack { position: absolute; inset: 0; }
        .act02-complexity-slot { position: absolute; left: 960px; width: 0; height: 0; }
        .act02-complexity-plate {
          position: absolute; left: -470px; top: -300px; width: 940px; height: 600px; overflow: hidden;
          transform: rotateX(56deg) rotateZ(-42deg); border-radius: 6px;
          box-shadow: 0 0 0 1px rgba(3, 39, 80, 0.18), 0 30px 60px rgba(3, 39, 80, 0.12);
        }
        .act02-complexity-plate canvas { display: block; width: 100%; height: 100%; }
        .act02-complexity-label {
          position: absolute; left: 520px; top: -14px; white-space: nowrap;
          font-family: var(--font-text); font-weight: 600; font-size: 17px; color: var(--navy);
        }
        .act02-complexity-label::before { content: ""; display: inline-block; width: 36px; height: 1px; background: var(--navy); vertical-align: middle; margin-right: 10px; opacity: 0.5; }
        #act02-complexity-admin { background: var(--navy); -webkit-mask: url(assets/geo/idn-adm1-bold.svg) center / 100% 100% no-repeat; mask: url(assets/geo/idn-adm1-bold.svg) center / 100% 100% no-repeat; }
        #act02-complexity-node {
          position: absolute; left: 945px; top: 585px; width: 30px; height: 30px; border-radius: 50%; background: #fff;
          box-shadow: 0 0 30px 12px rgba(255, 255, 255, 0.95), 0 0 80px 30px rgba(2, 74, 188, 0.35);
        }
        #act02-complexity-veil { position: absolute; inset: 0; background: var(--navy); }
      </style>
      <div id="act02-complexity-root" data-composition-id="act02-complexity" data-width="1920" data-height="1080">
        <div id="act02-complexity-stack"></div>
        <div id="act02-complexity-line1" class="act02-complexity-line"></div>
        <div id="act02-complexity-line2" class="act02-complexity-line"></div>
        <div id="act02-complexity-veil"></div>
        <div id="act02-complexity-node"></div>
      </div>
      <script>
        GV.register('act02-complexity', async (tl) => {
          const id = 'act02-complexity';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          $('line1').textContent = GV.COPY['complexity.line1'];
          $('line2').textContent = GV.COPY['complexity.line2'];

          const image = (src, crop) => () => GV.ditheredCanvas(src, 940, 600, { palette: 'brand', cell: 3, crop });
          const grid = () => {
            const c = document.createElement('canvas');
            c.width = 940; c.height = 600;
            const g = c.getContext('2d');
            const rnd = GV.seeded(2);
            for (let y = 0; y < 600; y += 30) for (let x = 0; x < 940; x += 30) {
              g.fillStyle = `rgba(31,175,161,${(rnd() * 0.7).toFixed(2)})`;
              g.fillRect(x + 2, y + 2, 26, 26);
            }
            return c;
          };
          const admin = () => {
            const d = document.createElement('div');
            d.id = `${id}-admin`;
            d.style.cssText = 'position:absolute;inset:0';
            return d;
          };

          // Bottom to top. Opacity rises with the stack so the top reads as a muddle.
          const P = GV.COPY['complexity.plates'];
          const plates = [
            [P[0], image('assets/sentinel/riau-plantation.jpg'), 1],
            [P[1], image('assets/solution/WRWS/desktop/WaterResource-Desktop.jpg', GV.cleanCrop('assets/solution/WRWS/desktop/WaterResource-Desktop.jpg')), 0.7],
            [P[2], image('assets/solution/ESC/desktop/biodiversity.jpg', GV.cleanCrop('assets/solution/ESC/desktop/biodiversity.jpg')), 0.6],
            [P[3], image('assets/solution/ESRE/desktop/Network-Desktop.jpg', GV.cleanCrop('assets/solution/ESRE/desktop/Network-Desktop.jpg')), 0.6],
            [P[4], grid, 0.75],
            [P[5], admin, 0.9],
            [P[6], image('assets/solution/DMR/desktop/risk.jpg', GV.cleanCrop('assets/solution/DMR/desktop/risk.jpg')), 0.55],
          ];
          const stack = $('stack');
          const slots = [];
          for (const [i, [label, make, opacity]] of plates.entries()) {
            const slot = document.createElement('div');
            slot.className = `${id}-slot`;
            const top = 880 - i * 66;
            slot.style.top = `${top}px`;
            const plate = document.createElement('div');
            plate.className = `${id}-plate`;
            plate.style.opacity = opacity;
            plate.append(await make());
            const tag = document.createElement('div');
            tag.className = `${id}-label`;
            tag.textContent = label;
            slot.append(plate, tag);
            stack.append(slot);
            slots.push({ slot, top });
          }

          // Plates drop in one by one from bar 7, beat 1 (slots move; the dithered canvases are never scaled).
          slots.forEach(({ slot }, i) => {
            gsap.set(slot, { y: -180, opacity: 0 });
            tl.to(slot, { y: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, A(7, 1) + i * 0.75);
          });

          const blurIn = { opacity: 0, y: 20, filter: 'blur(10px)' };
          const sharp = { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out' };
          const out = { opacity: 0, filter: 'blur(8px)', duration: 0.4 };
          gsap.set([$('line1'), $('line2')], blurIn);
          tl.to($('line1'), sharp, A(8));
          tl.to($('line1'), out, A(9, 3));
          tl.to($('line2'), sharp, A(10));
          tl.to($('line2'), out, A(11, 3));

          // Bar 12: everything is pulled into one node; on the silent last beat the frame dims around it
          // (stop-down), so act 03's white flash on 24.0 is a hard cut.
          slots.forEach(({ slot, top }, i) => {
            tl.to(slot, { y: 600 - top, opacity: 0, duration: 0.9, ease: 'power3.in' }, A(12) + i * 0.04);
          });
          gsap.set($('node'), { scale: 0, opacity: 0 });
          tl.to($('node'), { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, A(12, 2));
          gsap.set($('veil'), { opacity: 0 });
          tl.to($('veil'), { opacity: 0.92, duration: 0.25, ease: 'power2.out' }, A(12, 3));
        }, 12);
      </script>
    </template>
  </body>
</html>
