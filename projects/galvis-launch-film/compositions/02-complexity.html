<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act02-complexity-root { position: absolute; inset: 0; overflow: hidden; background: var(--light-gray); }
        .act02-complexity-line {
          position: absolute; left: 0; right: 0; top: 84px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 56px; letter-spacing: 0.02em; color: var(--navy);
        }
        #act02-complexity-stack { position: absolute; inset: 0; }
        .act02-complexity-slot { position: absolute; left: 960px; width: 0; height: 0; }
        .act02-complexity-plate {
          position: absolute; left: -470px; top: -300px; width: 940px; height: 600px; overflow: hidden;
          transform: rotateX(56deg) rotateZ(-42deg); border-radius: 6px;
          box-shadow: 0 0 0 1px rgba(3, 39, 80, 0.18), 0 30px 60px rgba(3, 39, 80, 0.12);
        }
        .act02-complexity-tint { position: absolute; inset: 0; background: #FFFFFF; opacity: 0; }
        .act02-complexity-plate canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
        #act02-complexity-outline-pos { position: absolute; left: 960px; top: 880px; width: 0; height: 0; }
        #act02-complexity-outline {
          position: absolute; left: -470px; top: -300px; width: 940px; height: 600px; background: var(--navy);
          -webkit-mask: url(assets/geo/idn-adm1-bold.svg) center / 100% 100% no-repeat; mask: url(assets/geo/idn-adm1-bold.svg) center / 100% 100% no-repeat;
        }
        .act02-complexity-moire {
          position: absolute; left: 260px; top: 160px; width: 1400px; height: 900px;
          background: repeating-linear-gradient(0deg, rgba(3, 39, 80, 0.55) 0 1px, transparent 1px 7px);
          -webkit-mask-image: radial-gradient(ellipse 48% 44% at 50% 56%, #000 30%, transparent 100%);
          mask-image: radial-gradient(ellipse 48% 44% at 50% 56%, #000 30%, transparent 100%);
        }
        .act02-complexity-label {
          position: absolute; left: 520px; top: -14px; white-space: nowrap;
          font-family: var(--font-text); font-weight: 600; font-size: 17px; color: var(--navy);
        }
        .act02-complexity-label::before { content: ""; display: inline-block; width: 36px; height: 1px; background: var(--navy); vertical-align: middle; margin-right: 10px; opacity: 0.5; }
        #act02-complexity-admin { background: var(--navy); -webkit-mask: url(assets/geo/idn-adm1-bold.svg) center / 100% 100% no-repeat; mask: url(assets/geo/idn-adm1-bold.svg) center / 100% 100% no-repeat; }
        #act02-complexity-node {
          position: absolute; left: 945px; top: 585px; width: 30px; height: 30px; border-radius: 50%; background: #fff;
          box-shadow: 0 0 30px 12px rgba(255, 255, 255, 0.95), 0 0 80px 30px rgba(2, 74, 188, 0.35);
        }
        #act02-complexity-veil { position: absolute; inset: 0; background: var(--navy); }
      </style>
      <div id="act02-complexity-root" data-composition-id="act02-complexity" data-width="1920" data-height="1080">
        <div id="act02-complexity-outline-pos"><div id="act02-complexity-outline"></div></div>
        <div id="act02-complexity-stack"></div>
        <div id="act02-complexity-moire-a" class="act02-complexity-moire"></div>
        <div id="act02-complexity-moire-b" class="act02-complexity-moire"></div>
        <div id="act02-complexity-line1" class="act02-complexity-line"></div>
        <div id="act02-complexity-line2" class="act02-complexity-line"></div>
        <div id="act02-complexity-veil"></div>
        <div id="act02-complexity-node"></div>
      </div>
      <script>
        GV.register('act02-complexity', async (tl) => {
          const id = 'act02-complexity';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          $('line1').textContent = GV.COPY['complexity.line1'];
          $('line2').textContent = GV.COPY['complexity.line2'];

          // Image plates come as a dithered canvas plus a clear copy (resolve 1): the vortex spins and shrinks
          // the clear copy, never the dithered one.
          // Each image plate keeps 6 % of margin in its crop so its content can drift (redrawn, never moved).
          const inset = ([x, y, w, h] = [0, 0, 1, 1]) => [x + w * 0.03, y + h * 0.03, w * 0.94, h * 0.94];
          const image = (src, crop) => async () => {
            const base = inset(crop);
            const d = await GV.ditheredCanvas(src, 940, 600, { palette: 'brand', cell: 3, crop: base });
            d.base = base;
            return [d, await GV.ditheredCanvas(src, 940, 600, { palette: 'brand', cell: 3, crop: base, resolve: 1 })];
          };
          const grid = () => {
            const c = document.createElement('canvas');
            c.width = 940; c.height = 600;
            const g = c.getContext('2d');
            const rnd = GV.seeded(2);
            for (let y = 0; y < 600; y += 30) for (let x = 0; x < 940; x += 30) {
              g.fillStyle = `rgba(31,175,161,${(rnd() * 0.7).toFixed(2)})`;
              g.fillRect(x + 2, y + 2, 26, 26);
            }
            return c;
          };
          const admin = () => {
            const d = document.createElement('div');
            d.id = `${id}-admin`;
            d.style.cssText = 'position:absolute;inset:0';
            return d;
          };

          // Bottom to top. Opacity rises with the stack so the top reads as a muddle.
          const P = GV.COPY['complexity.plates'];
          const plates = [
            [P[0], image('assets/sentinel/riau-plantation.jpg'), 1],
            [P[1], image('assets/solution/WRWS/desktop/WaterResource-Desktop.jpg', GV.cleanCrop('assets/solution/WRWS/desktop/WaterResource-Desktop.jpg')), 0.7],
            [P[2], image('assets/solution/ESC/desktop/biodiversity.jpg', GV.cleanCrop('assets/solution/ESC/desktop/biodiversity.jpg')), 0.6],
            [P[3], image('assets/solution/ESRE/desktop/Network-Desktop.jpg', GV.cleanCrop('assets/solution/ESRE/desktop/Network-Desktop.jpg')), 0.6],
            [P[4], grid, 0.75],
            [P[5], admin, 0.9],
            [P[6], image('assets/solution/DMR/desktop/risk.jpg', GV.cleanCrop('assets/solution/DMR/desktop/risk.jpg')), 0.55],
          ];
          const stack = $('stack');
          const slots = [];
          const labels = [];
          for (const [i, [label, make, opacity]] of plates.entries()) {
            const slot = document.createElement('div');
            slot.className = `${id}-slot`;
            const top = 880 - i * 66;
            slot.style.top = `${top}px`;
            const plate = document.createElement('div');
            plate.className = `${id}-plate`;
            plate.style.opacity = opacity;
            const made = await make();
            const [dithered, clear] = Array.isArray(made) ? made : [made, null];
            plate.append(dithered);
            if (clear) { clear.style.opacity = '0'; plate.append(clear); }
            const tint = document.createElement('i'); // flashes white over the plate as it lands
            tint.className = `${id}-tint`;
            plate.append(tint);
            const tag = document.createElement('div');
            tag.className = `${id}-label`;
            tag.textContent = label;
            labels.push(tag);
            slot.append(plate, tag);
            stack.append(slot);
            slots.push({ slot, top, plate, tint, dithered: clear ? dithered : null, clear, drift: [Math.cos(i * 2.4), Math.sin(i * 2.4)] });
          }

          // Bar 7: Indonesia appears seen from above, then tilts onto the plane the plates will stack on.
          gsap.set($('outline'), { opacity: 0, y: -360, rotationX: 0, rotationZ: 0 });
          tl.to($('outline'), { opacity: 0.85, duration: 0.2 }, A(7));
          tl.to($('outline'), { y: 0, rotationX: 56, rotationZ: -42, duration: 0.3, ease: 'power2.inOut' }, A(7) + 0.2);
          tl.to($('outline'), { opacity: 0, duration: 0.2 }, A(7, 1) + 0.15);

          // Every plate's state is a function of time: it drops in on its beat (expo out, so it lands on the
          // frame), and from bar 12 spirals into the node (vortex-keyhole) as its clear copy.
          const LAND = slots.map((_, i) => A(7, 1) + i * 0.5);
          const VORTEX = A(12), NODE = [960, 600];
          const expoOut = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
          // Once the last plate is down the stack breathes until the vortex: plates spread apart (up to 16 px
          // each from the middle) while the whole stack turns 4° and pushes in 5 % around the node.
          const SETTLED = LAND[LAND.length - 1] + 0.25;
          const breathe = (t) => GV.since(t, SETTLED, VORTEX - SETTLED, (k) => k * k * (3 - 2 * k));
          const spread = (i, t) => -(i - 3) * 16 * breathe(t);
          // A plate falls in over the 0.25 s before its beat (accelerating) and lands on it with an edge flash.
          const placeSlots = (t) => slots.forEach(({ slot, top, plate, tint, dithered, clear, drift }, i) => {
            const fall = Math.min(1, Math.max(0, (t - (LAND[i] - 0.25)) / 0.25));
            let state = { x: 0, y: -160 * (1 - fall * fall) + spread(i, t), scale: 1, rotation: 0, opacity: Math.min(1, fall * 1.6) };
            const flash = t < LAND[i] ? 0 : Math.exp(-(t - LAND[i]) * 9);
            plate.style.boxShadow = `0 0 0 ${(1 + 5 * flash).toFixed(2)}px rgba(255,255,255,${(0.18 + 0.82 * flash).toFixed(3)}), 0 0 ${(64 * flash).toFixed(1)}px rgba(31,175,161,${(0.9 * flash).toFixed(3)}), 0 30px 60px rgba(3, 39, 80, 0.12)`;
            plate.style.filter = flash > 0.01 ? `brightness(${(1 + 0.4 * flash).toFixed(3)})` : '';
            tint.style.opacity = (0.45 * flash).toFixed(3);
            // The stack gets messier: each plate's content drifts its own way, faster as more plates land.
            if (dithered && t >= LAND[i] && t < VORTEX) {
              const landed = LAND.filter((l) => t >= l).length;
              const amp = 0.012 + 0.003 * landed;
              const u = Math.sin((t - LAND[i]) * (0.6 + 0.12 * landed));
              const [bx, by, bw, bh] = dithered.base;
              dithered.layer.set({ crop: [bx + drift[0] * amp * u * bw, by + drift[1] * amp * u * bh, bw, bh] });
              dithered.layer.draw();
            }
            const k = Math.min(1, Math.max(0, (t - VORTEX - i * 0.05) / 1.3));
            if (k > 0) {
              const from = top + spread(i, VORTEX); // the vortex starts from where the breathing left the plate
              const v = GV.vortexPoint([960, from], NODE, Math.pow(k, 1.3));
              state = { x: v.x - 960, y: v.y - top, scale: v.scale, rotation: v.rotation, opacity: 1 - Math.max(0, (k - 0.75) / 0.25) };
            }
            const swap = clear ? Math.min(1, Math.max(0, (t - VORTEX) / 0.1)) : 0;
            if (clear) { clear.style.opacity = String(swap); dithered.style.opacity = String(1 - swap); }
            gsap.set(slot, state);
          });

          // Moiré: two line gratings over the stack, turning against each other, denser as plates land.
          const moire = (t) => {
            const landed = LAND.filter((l) => t >= l).length;
            const o = Math.min(0.32, landed * 0.045) * (t < VORTEX ? 1 : Math.max(0, 1 - (t - VORTEX) / 0.6));
            gsap.set($('moire-a'), { rotation: 4 + t * 0.9, opacity: o });
            gsap.set($('moire-b'), { rotation: -3 - t * 0.6, opacity: o });
          };
          // Labels leave as the vortex starts; only the plates are pulled in.
          tl.to(labels, { opacity: 0, duration: 0.2 }, VORTEX);

          const clock = { t: 0 };
          const apply = (t) => {
            placeSlots(t); moire(t);
            const b = breathe(t);
            gsap.set(stack, { transformOrigin: `${NODE[0]}px ${NODE[1]}px`, rotation: 4 * b, scale: 1 + 0.05 * b });
          };
          tl.to(clock, { t: 12, duration: 12, ease: 'none', onUpdate: () => apply(clock.t) }, 0);
          apply(0);

          const blurIn = { opacity: 0, y: 20, filter: 'blur(10px)' };
          const sharp = { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.6, ease: 'expo.out' };
          const out = { opacity: 0, filter: 'blur(8px)', duration: 0.4 };
          gsap.set([$('line1'), $('line2')], blurIn);
          tl.to($('line1'), sharp, A(8));
          tl.to($('line1'), out, A(9, 3));
          tl.to($('line2'), sharp, A(10));
          tl.to($('line2'), out, A(11, 3));

          // Bar 12: everything has been pulled into one node; on the silent last beat the frame dims around it
          // (stop-down), so act 03's white flash on 24.0 is a hard cut.
          gsap.set($('node'), { scale: 0, opacity: 0 });
          tl.to($('node'), { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2)' }, A(12, 2));
          gsap.set($('veil'), { opacity: 0 });
          tl.to($('veil'), { opacity: 0.92, duration: 0.25, ease: 'power2.out' }, A(12, 3));
        }, 12);
      </script>
    </template>
  </body>
</html>
