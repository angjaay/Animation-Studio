<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act02-complexity-root { position: absolute; inset: 0; overflow: hidden; background: var(--light-gray); }
        #act02-complexity-line {
          position: absolute; left: 0; right: 0; top: 84px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 56px; letter-spacing: 0.02em; color: var(--navy);
        }
        #act02-complexity-stack { position: absolute; inset: 0; }
        .act02-complexity-slot { position: absolute; left: 960px; width: 0; height: 0; }
        .act02-complexity-plate {
          position: absolute; left: -470px; top: -300px; width: 940px; height: 600px; overflow: hidden;
          transform: rotateX(56deg) rotateZ(-42deg); border-radius: 6px;
          box-shadow: 0 0 0 1px rgba(3, 39, 80, 0.18), 0 30px 60px rgba(3, 39, 80, 0.12);
        }
        .act02-complexity-plate canvas { display: block; width: 100%; height: 100%; }
        .act02-complexity-label {
          position: absolute; left: 520px; top: -14px; white-space: nowrap;
          font-family: var(--font-text); font-weight: 600; font-size: 17px; color: var(--navy);
        }
        .act02-complexity-label::before { content: ""; display: inline-block; width: 36px; height: 1px; background: var(--navy); vertical-align: middle; margin-right: 10px; opacity: 0.5; }
        #act02-complexity-admin { background: var(--navy); -webkit-mask: url(assets/geo/idn-adm1-bold.svg) center / 100% 100% no-repeat; mask: url(assets/geo/idn-adm1-bold.svg) center / 100% 100% no-repeat; }
      </style>
      <div id="act02-complexity-root" data-composition-id="act02-complexity" data-width="1920" data-height="1080">
        <div id="act02-complexity-stack"></div>
        <div id="act02-complexity-line"></div>
      </div>
      <script>
        (async () => {
          const id = 'act02-complexity';
          document.getElementById(`${id}-line`).textContent = GV.COPY['complexity.line1'];

          const image = (src, crop) => () => GV.ditheredCanvas(src, 940, 600, { palette: 'brand', cell: 3, crop });
          const grid = () => {
            const c = document.createElement('canvas');
            c.width = 940; c.height = 600;
            const g = c.getContext('2d');
            const rnd = GV.seeded(2);
            for (let y = 0; y < 600; y += 30) for (let x = 0; x < 940; x += 30) {
              g.fillStyle = `rgba(31,175,161,${(rnd() * 0.7).toFixed(2)})`;
              g.fillRect(x + 2, y + 2, 26, 26);
            }
            return c;
          };
          const admin = () => {
            const d = document.createElement('div');
            d.id = `${id}-admin`;
            d.style.cssText = 'position:absolute;inset:0';
            return d;
          };

          // Bottom to top. Opacity rises with the stack so the top reads as a muddle.
          const plates = [
            ['Satellite imagery', image('assets/sentinel/riau-plantation.jpg'), 1],
            ['Terrain model', image('assets/solution/WRWS/desktop/WaterResource-Desktop.jpg', GV.cleanCrop('assets/solution/WRWS/desktop/WaterResource-Desktop.jpg')), 0.7],
            ['Environmental variables', image('assets/solution/ESC/desktop/biodiversity.jpg', GV.cleanCrop('assets/solution/ESC/desktop/biodiversity.jpg')), 0.6],
            ['Infrastructure networks', image('assets/solution/ESRE/desktop/Network-Desktop.jpg', GV.cleanCrop('assets/solution/ESRE/desktop/Network-Desktop.jpg')), 0.6],
            ['Demographic grids', grid, 0.75],
            ['Administrative boundaries', admin, 0.9],
            ['Analytical outputs', image('assets/solution/DMR/desktop/risk.jpg', GV.cleanCrop('assets/solution/DMR/desktop/risk.jpg')), 0.55],
          ];
          const stack = document.getElementById(`${id}-stack`);
          for (const [i, [label, make, opacity]] of plates.entries()) {
            const slot = document.createElement('div');
            slot.className = `${id}-slot`;
            slot.style.top = `${880 - i * 66}px`;
            const plate = document.createElement('div');
            plate.className = `${id}-plate`;
            plate.style.opacity = opacity;
            plate.append(await make());
            const tag = document.createElement('div');
            tag.className = `${id}-label`;
            tag.textContent = label;
            slot.append(plate, tag);
            stack.append(slot);
          }

          const tl = gsap.timeline({ paused: true });
          window.__timelines["act02-complexity"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
