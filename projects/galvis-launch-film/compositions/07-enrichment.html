<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act07-enrichment-root { position: absolute; inset: 0; overflow: hidden; background: var(--light-gray); }
        #act07-enrichment-tag {
          position: absolute; left: 96px; top: 96px; font-family: var(--font-text); font-weight: 700; font-size: 18px;
          letter-spacing: 0.18em; color: var(--navy);
        }
        #act07-enrichment-tag i { display: block; width: 64px; height: 4px; border-radius: 2px; background: var(--teal); margin-top: 12px; }
        #act07-enrichment-sub { position: absolute; left: 96px; top: 150px; font-family: var(--font-display); font-weight: 700; font-size: 40px; color: var(--navy); }
        #act07-enrichment-close { position: absolute; inset: 0; }
        #act07-enrichment-thread, #act07-enrichment-outline { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #act07-enrichment-shape { position: absolute; left: 180px; top: 260px; width: 720px; height: 720px; }
        #act07-enrichment-card {
          position: absolute; left: 1040px; top: 150px; width: 700px; background: #fff; border-radius: 18px;
          box-shadow: 0 24px 64px rgba(3, 39, 80, 0.14); padding: 28px 32px 22px; font-family: var(--font-text);
        }
        #act07-enrichment-card h3 { font-family: var(--font-display); font-size: 26px; color: var(--navy); margin: 0 0 4px; }
        #act07-enrichment-card p { font-size: 15px; color: var(--text-muted); margin: 0 0 16px; }
        .act07-enrichment-row { display: grid; grid-template-columns: 64px 220px 1fr 60px; align-items: center; gap: 16px; height: 66px; border-top: 1px solid var(--cool-gray); }
        .act07-enrichment-row canvas { width: 64px; height: 42px; border-radius: 6px; display: block; }
        .act07-enrichment-row b { font-size: 17px; color: var(--navy); font-weight: 700; }
        .act07-enrichment-row .act07-enrichment-bar { height: 8px; border-radius: 4px; background: var(--cool-gray); position: relative; }
        .act07-enrichment-row .act07-enrichment-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--teal); }
        .act07-enrichment-row em { font-style: normal; font-family: var(--font-mono); font-size: 16px; color: var(--navy); text-align: right; }
        #act07-enrichment-wide { position: absolute; inset: 0; }
        #act07-enrichment-region { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #act07-enrichment-flow {
          position: absolute; left: 0; right: 0; top: 930px; display: flex; justify-content: center; align-items: center; gap: 18px;
          font-family: var(--font-text); font-weight: 700; font-size: 26px; color: var(--navy);
        }
        #act07-enrichment-flow svg { width: 22px; height: 22px; }
        .act07-enrichment-step { padding: 6px 14px; border-radius: 22px; }
        #act07-enrichment-dark { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
        #act07-enrichment-arch { position: absolute; inset: 0; }
        #act07-enrichment-arch svg { position: absolute; inset: 0; transform-origin: 0 0; }
        #act07-enrichment-position {
          position: absolute; left: 0; right: 0; top: 860px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 52px; color: var(--navy);
        }
      </style>
      <div id="act07-enrichment-root" data-composition-id="act07-enrichment" data-width="1920" data-height="1080">
        <div id="act07-enrichment-wide">
          <canvas id="act07-enrichment-region" width="1920" height="1080"></canvas>
          <div id="act07-enrichment-flow"></div>
          <div id="act07-enrichment-position"></div>
        </div>
        <div id="act07-enrichment-close">
          <svg id="act07-enrichment-thread" viewBox="0 0 1920 1080"></svg>
          <canvas id="act07-enrichment-shape" width="720" height="720"></canvas>
          <svg id="act07-enrichment-outline" viewBox="0 0 1920 1080"></svg>
          <div id="act07-enrichment-card"><h3></h3><p></p></div>
        </div>
        <div id="act07-enrichment-tag"></div>
        <div id="act07-enrichment-sub"></div>
        <canvas id="act07-enrichment-dark" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <div id="act07-enrichment-arch" data-layout-allow-overflow></div>
      </div>
      <script>
        GV.register('act07-enrichment', async (tl) => {
          const id = 'act07-enrichment';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          $('tag').textContent = GV.COPY['products.enrichment'];
          $('tag').append(document.createElement('i'));
          $('sub').textContent = GV.COPY['enrichment.sub'];
          $('position').textContent = GV.COPY['enrichment.position'];

          // Each attribute is one solution map from gisact.io (content checked against the files).
          const S = 'assets/solution';
          // In the order of GV.COPY['enrichment.attrs']: Earth Observation, Environment, Terrain, Infrastructure,
          // Accessibility, Land Use, Demographics, Economic Activity, Climate, Risk Indicators.
          const MAP_PATHS = [
            `${S}/ESC/desktop/biodiversity.jpg`,
            `${S}/ESC/desktop/environmental.jpg`,
            `${S}/WRWS/desktop/WaterResource-Desktop.jpg`,
            `${S}/UIC/desktop/Transport-Desktop.jpg`,
            `${S}/EBG/desktop/Geomarketing-Desktop.jpg`,
            `${S}/AFS/desktop/foodsecurity.jpg`,
            `${S}/EBG/desktop/UrbanPlanning-Desktop.jpg`,
            `${S}/EBG/desktop/SiteSelection-Desktop.jpg`,
            `${S}/UIC/desktop/Urban-Desktop.jpg`,
            `${S}/DMR/desktop/risk.jpg`,
          ];
          const VALUES = [0.81, 0.64, 0.42, 0.57, 0.73, 0.38, 0.49, 0.66, 0.71, 0.27];
          const CROP = [0.05, 0.25, 0.45, 0.45]; // map body only, clear of the baked-in legend and label
          const attrs = GV.COPY['enrichment.attrs'];
          const images = await Promise.all(MAP_PATHS.map((p) => GV.loadImage(p)));

          // Profile card rows.
          const card = $('card');
          card.querySelector('h3').textContent = GV.COPY['enrichment.profile'].title;
          card.querySelector('p').textContent = GV.COPY['enrichment.profile'].subtitle;
          const rows = attrs.map((name, i) => {
            const row = document.createElement('div');
            row.className = `${id}-row`;
            const thumb = document.createElement('canvas');
            thumb.width = 128; thumb.height = 84;
            const img = images[i];
            thumb.getContext('2d').drawImage(img, CROP[0] * img.width, CROP[1] * img.height, CROP[2] * img.width, CROP[3] * img.height * 0.66, 0, 0, 128, 84);
            const label = document.createElement('b');
            label.textContent = name;
            const bar = document.createElement('div');
            bar.className = `${id}-bar`;
            const fill = document.createElement('i');
            fill.style.width = `${VALUES[i] * 100}%`;
            bar.append(fill);
            const val = document.createElement('em');
            val.textContent = VALUES[i].toFixed(2);
            row.append(thumb, label, bar, val);
            card.append(row);
            return row;
          });

          // Rows land on the 1/8 grid, accelerating: every beat for six rows, then every eighth note.
          const ROW_AT = (k) => (k < 6 ? A(41) + k * 0.5 : A(42, 2) + (k - 6) * 0.25);

          // The polygon: a mosaic of attribute maps clipped to Riau. Each cell resolves from raw (dithered)
          // to clear on its own schedule; the frame is recomposed from the cells whenever one changes.
          const outline = new Path2D(GV.RIAU_SVG.match(/ d="([^"]+)"/)[1]);
          const g = $('shape').getContext('2d');
          const cols = 4, nrows = 3, cw = 600 / cols, ch = 600 / nrows;
          const cells = Array.from({ length: cols * nrows }, (_, k) => {
            const canvas = document.createElement('canvas');
            canvas.width = Math.ceil(cw * 1.2); canvas.height = Math.ceil(ch * 1.2);
            const layer = GV.mountDither(canvas, images[k % images.length], { palette: 'brand', cell: 3, resolve: 0, crop: CROP });
            layer.draw();
            const at = ROW_AT(Math.min(k, 9));
            return { canvas, layer, at, resolve: 0 };
          });
          const compose = (fill) => {
            g.clearRect(0, 0, 720, 720);
            g.save();
            g.scale(720 / 600, 720 / 600);
            g.clip(outline);
            g.globalAlpha = fill;
            cells.forEach((c, k) => g.drawImage(c.canvas, (k % cols) * cw, Math.floor(k / cols) * ch, cw, ch));
            g.strokeStyle = 'rgba(255,255,255,0.9)';
            g.lineWidth = 1;
            for (let c = 1; c < cols; c++) { g.beginPath(); g.moveTo(c * cw, 0); g.lineTo(c * cw, 600); g.stroke(); }
            for (let r = 1; r < nrows; r++) { g.beginPath(); g.moveTo(0, r * ch); g.lineTo(600, r * ch); g.stroke(); }
            g.globalAlpha = 1;
            g.restore();
          };

          // Outline drawn as SVG (stroke-dash), in the canvas's 720/600 frame placed at (180, 260).
          $('outline').innerHTML = `<g transform="translate(180 260) scale(1.2)"><path d="${GV.RIAU_SVG.match(/ d="([^"]+)"/)[1]}" fill="none" stroke="#1FAFA1" stroke-width="2.9"/></g>`;
          const outlinePath = $('outline').querySelector('path');
          const outlineLen = outlinePath.getTotalLength();
          gsap.set(outlinePath, { strokeDasharray: outlineLen, strokeDashoffset: outlineLen });
          tl.to(outlinePath, { strokeDashoffset: 0, duration: 1.6, ease: 'power2.inOut' }, A(40));

          $('thread').innerHTML =
            '<path id="act07-enrichment-down" d="M736 0 L736 560" stroke="#1FAFA1" stroke-width="3" fill="none"/>' +
            '<circle id="act07-enrichment-node" cx="736" cy="560" r="8" fill="#1FAFA1" stroke="#FFFFFF" stroke-width="2"/>' +
            '<path id="act07-enrichment-lead" d="M744 560 C900 560, 930 430, 1040 430" stroke="#1FAFA1" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 6" fill="none"/>';
          const down = $('down');
          gsap.set(down, { strokeDasharray: 560, strokeDashoffset: 560 });
          tl.to(down, { strokeDashoffset: 0, duration: 1.0, ease: 'power2.in' }, A(40));
          gsap.set([$('node'), $('lead')], { opacity: 0 });
          tl.to($('node'), { opacity: 1, duration: 0.2 }, A(40) + 1.0);
          tl.to($('lead'), { opacity: 1, duration: 0.4 }, A(41));

          // Bar 39: title after the architecture glimpse. Bars 41-42: each attribute row lands on its grid
          // step with a teal flash while its map cell resolves.
          gsap.set([$('tag'), $('sub')], { opacity: 0, y: 16 });
          // The headline lands on the beat; the small tag leads it by one stagger.
          tl.to($('tag'), { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(39, 2) - 0.12);
          tl.to($('sub'), { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(39, 2));
          gsap.set(card, { opacity: 0, x: 40 });
          tl.to(card, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, A(41) - 0.4);
          gsap.set(rows, { opacity: 0, x: 40 });
          rows.forEach((row, i) => {
            tl.to(row, { opacity: 1, x: 0, duration: 0.35, ease: 'expo.out' }, ROW_AT(i));
            tl.set(row, { backgroundColor: 'rgba(31,175,161,0.28)' }, ROW_AT(i));
            tl.to(row, { backgroundColor: 'rgba(31,175,161,0)', duration: 0.5, ease: 'power2.out' }, ROW_AT(i) + 1 / 30);
          });

          // Bars 43-44: the camera pulls back — one place becomes thousands across the region.
          const region = $('region').getContext('2d');
          const rnd = GV.seeded(7);
          // Thousands of locations in Indonesia (the spec's pull-back), lighting up together in one wave.
          const COUNTRY = GV3D.GLOBE_SEA.countries;
          const pts = GV.SEA_POINTS.filter((_, i) => COUNTRY[i] === 'IDN').map(([x, y]) => ({ x, y, at: A(43) + 0.3 + rnd() * 0.5 }));
          const seaPaths = [...GV.SEA_SVG.matchAll(/ d="([^"]+)"/g)].map(([, d]) => new Path2D(d));
          const drawRegion = (t) => {
            region.clearRect(0, 0, 1920, 1080);
            if (t < A(43)) return; // the wide shot is still hidden
            region.save();
            // A slow camera drifts in on the region for the rest of the act (vector map, redrawn).
            const RS = 0.72 * (1 + 0.08 * GV.since(t, A(43), A(45, 3) - A(43), (k) => k));
            region.translate(960 - (1920 * RS) / 2, 6 - 40 * (RS / 0.72 - 1));
            region.scale(RS, RS);
            region.strokeStyle = 'rgba(3,39,80,0.35)';
            region.lineWidth = 1.4 / RS;
            for (const path of seaPaths) region.stroke(path);
            region.fillStyle = '#1FAFA1';
            for (const p of pts) {
              const k = Math.min(1, (t - p.at) / 0.25);
              if (k > 0) { region.globalAlpha = k; region.fillRect(p.x - 2.5, p.y - 2.5, 5, 5); }
            }
            region.restore();
          };
          const flow = $('flow');
          const chevron = '<svg viewBox="0 0 24 24"><path d="M8 4l8 8-8 8" fill="none" stroke="#1FAFA1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          GV.COPY['enrichment.flow'].forEach((step, i) => {
            if (i) flow.insertAdjacentHTML('beforeend', `<span class="${id}-chev">${chevron}</span>`);
            const span = document.createElement('span');
            span.className = `${id}-step`;
            span.textContent = step;
            flow.append(span);
          });
          const flowParts = [...flow.children];

          let lastKey = '';
          const apply = (t) => {
            cells.forEach((c) => {
              const r = Math.min(1, Math.max(0, (t - c.at) / 0.35));
              if (Math.abs(r - c.resolve) > 1e-3) { c.resolve = r; c.layer.set({ resolve: r }); c.layer.draw(); }
            });
            const fill = t < A(40) ? 0 : t < A(41) ? 0.35 * Math.min(1, (t - A(40)) / 1.5) : Math.min(1, 0.35 + (t - A(41)) / 1.2);
            const key = cells.map((c) => c.resolve.toFixed(3)).join() + fill.toFixed(3);
            if (key !== lastKey) { compose(fill); lastKey = key; }
            drawRegion(t);
          };
          const clock = { t: 0 };
          tl.to(clock, { t: 14, duration: 14, ease: 'none', onUpdate: () => { apply(clock.t); frame(clock.t); } }, 0);
          apply(0);

          gsap.set($('wide'), { opacity: 0 });
          tl.to($('close'), { opacity: 0, duration: 0.6 }, A(43));
          tl.to([$('tag'), $('sub')], { opacity: 0, duration: 0.4 }, A(43));
          tl.to($('wide'), { opacity: 1, duration: 0.6 }, A(43));
          // The chain, one step per beat from bar 44 (chevrons lead each step in).
          gsap.set(flowParts, { opacity: 0, y: 12 });
          flowParts.forEach((p, i) => {
            const step = Math.floor((i + 1) / 2);
            const at = A(44) + step * 0.5 - (i % 2 ? 0.12 : 0);
            tl.to(p, { opacity: 1, y: 0, duration: 0.35, ease: 'expo.out' }, at);
            if (i % 2 === 0) {
              tl.set(p, { backgroundColor: 'rgba(31,175,161,0.32)' }, at);
              tl.to(p, { backgroundColor: 'rgba(31,175,161,0)', duration: 0.5, ease: 'power2.out' }, at + 1 / 30);
            }
          });
          gsap.set($('position'), { opacity: 0, y: 16 });
          tl.to(flow, { opacity: 0, duration: 0.2 }, A(45) - 0.2);
          tl.to($('position'), { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(45));
          tl.set([$('position'), $('wide')], { opacity: 0 }, A(45, 3)); // under the returning navy

          // Opening: act 06's last frame (architecture, middle branch lit), the camera pushes into that
          // branch's end while the navy dissolves to light. Closing: on 89.5 the navy is back with the
          // right branch lit, the frame act 08 opens from.
          const CAM = GV.CAM_END;
          const curtainCtx = $('dark').getContext('2d');
          const END = [960, 540 + (820 - 540) * CAM];
          const curtain = GV.mountCurtain($('dark'), curtainCtx.createPattern(GV.navyGlowCanvas(CAM), 'no-repeat'), 6, { origin: END });
          const middle = GV.architectureSvg({ lit: 'enrichment', scale: CAM });
          const right = GV.architectureSvg({ lit: 'enterprise', scale: CAM });
          const BACK = A(45, 3);
          let showing = '';
          const frame = (t) => {
            const which = t < 1 ? middle : t >= BACK ? right : '';
            if (which !== showing) { $('arch').innerHTML = which; showing = which; }
            const push = GV.since(t, 0, 0.8, (k) => k * k);
            const svgEl = $('arch').firstElementChild;
            if (svgEl) {
              const k = t < 1 ? 1 + 1.4 * push : 1;
              svgEl.style.transform = `matrix(${k}, 0, 0, ${k}, ${(END[0] * (1 - k)).toFixed(1)}, ${(END[1] * (1 - k)).toFixed(1)})`;
            }
            $('arch').style.opacity = String(t < 1 ? 1 - GV.since(t, 0.45, 0.35) : t >= BACK ? 1 : 0);
            const navy = t < BACK ? 1 - GV.since(t, 0.25, 0.75, (k) => k) : 1;
            curtain.set(1 - navy);
            $('dark').style.visibility = navy > 0 ? 'visible' : 'hidden';
            $('arch').style.visibility = (t < 1 || t >= BACK) ? 'visible' : 'hidden';
          };
          frame(0);
        }, 14);
      </script>
    </template>
  </body>
</html>
