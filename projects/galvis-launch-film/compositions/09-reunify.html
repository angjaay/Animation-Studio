<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act09-reunify-root { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }
        #act09-reunify-light { position: absolute; inset: 0; background: var(--light-gray); }
        #act09-reunify-curtain, #act09-reunify-map, #act09-reunify-nodes { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
        #act09-reunify-glow { position: absolute; inset: 0; background: radial-gradient(ellipse 1100px 560px at 960px 420px, rgba(2, 74, 188, 0.45), rgba(3, 39, 80, 0)); }
        #act09-reunify-diagram { position: absolute; inset: 0; transform-origin: 960px 540px; }
        #act09-reunify-chord { position: absolute; inset: 0; opacity: 0; background: radial-gradient(circle 420px at 960px 560px, rgba(255, 255, 255, 0.75), rgba(31, 175, 161, 0.22) 45%, rgba(3, 39, 80, 0) 100%); }
        #act09-reunify-net, #act09-reunify-dots { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        #act09-reunify-mark { position: absolute; left: 885px; top: 120px; width: 150px; height: 164px; }
        #act09-reunify-mark > div { position: absolute; inset: 0; }
        #act09-reunify-mark svg { width: 100%; height: 100%; display: block; }
        #act09-reunify-core {
          position: absolute; left: 760px; top: 532px; width: 400px; height: 56px; box-sizing: border-box; border-radius: 28px;
          border: 1.5px solid rgba(255, 255, 255, 0.6); background: var(--navy); display: flex; align-items: center; justify-content: center;
          font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: 0.16em; color: var(--white);
        }
        .act09-reunify-product {
          position: absolute; top: 856px; width: 460px; margin-left: -230px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: 0.08em; color: var(--white);
        }
        #act09-reunify-one {
          position: absolute; left: 0; right: 0; top: 842px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 72px; letter-spacing: 0.06em; color: var(--white);
        }
        #act09-reunify-many {
          position: absolute; left: 0; right: 0; top: 944px; text-align: center;
          font-family: var(--font-text); font-weight: 600; font-size: 30px; letter-spacing: 0.04em; color: var(--cool-gray);
        }
      </style>
      <div id="act09-reunify-root" data-composition-id="act09-reunify" data-width="1920" data-height="1080">
        <div id="act09-reunify-glow"></div>
        <canvas id="act09-reunify-map" width="1920" height="1080"></canvas>
        <canvas id="act09-reunify-nodes" width="1920" height="1080"></canvas>
        <div id="act09-reunify-chord"></div>
        <div id="act09-reunify-diagram">
          <svg id="act09-reunify-net" viewBox="0 0 1920 1080"></svg>
          <div id="act09-reunify-mark"></div>
          <div id="act09-reunify-core"></div>
          <div id="act09-reunify-products"></div>
          <!-- The curtain covers the diagram but not the rooms: they pop over the light frame act 08 left. -->
          <canvas id="act09-reunify-curtain" width="1920" height="1080"></canvas>
          <canvas id="act09-reunify-dots" width="1920" height="1080"></canvas>
        </div>
        <div id="act09-reunify-one"></div>
        <div id="act09-reunify-many"></div>
      </div>
      <script>
        GV.register('act09-reunify', async (tl) => {
          const id = 'act09-reunify';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          $('one').textContent = GV.COPY['reunify.line1'];
          $('many').textContent = GV.COPY['reunify.line2'];
          $('core').textContent = GV.COPY['core.label'];

          // Bar 54 opens on the light frame act 08 left, and a navy Bayer curtain closes over it.
          const curtain = GV.mountCurtain($('curtain'), '#F5F6F8', 12, { origin: [960, 300] }); // opens from the core

          // The architecture, with the same geometry as the split in act 05.
          const SPLIT = [960, 560];
          const ENDS = [[420, 820], [960, 820], [1500, 820]];
          const PRODUCTS = [['products.workspace', '#024ABC'], ['products.enrichment', '#1FAFA1'], ['products.enterprise', '#86C36A']];
          const geo = GV.branchGeometry({ top: [960, 300], split: SPLIT, ends: ENDS });
          let net = `<path d="${geo.trunk}" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2.5" fill="none"/>`;
          net += geo.branches.map((d, i) => `<path d="${d}" stroke="${PRODUCTS[i][1]}" stroke-width="2.5" fill="none"/>`).join('');
          net += ENDS.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="9" fill="${PRODUCTS[i][1]}" stroke="#FFFFFF" stroke-width="2"/>`).join('');
          $('net').innerHTML = net;
          const branches = [...$('net').querySelectorAll('path')].slice(1);
          const parts = GV.logoParts('act09');
          for (const key of ['hexagon', 'arrow', 'plates']) {
            const layer = document.createElement('div');
            layer.innerHTML = parts[key];
            $('mark').append(layer);
          }
          const names = PRODUCTS.map(([key], i) => {
            const el = document.createElement('div');
            el.className = `${id}-product`;
            el.style.left = `${ENDS[i][0]}px`;
            el.textContent = GV.COPY[key];
            $('products').append(el);
            return el;
          });

          // Bar 54, foldback: each product's "room" (a miniature of its act) pops up at its branch end on its
          // bell (106.0 / 106.5 / 107.0), folds into a badge in the product colour and climbs back to the core,
          // arriving 0.9 s after it left. Then, on the hold, light keeps rising up the branches.
          const TRAVEL = 0.9;
          const departs = [A(54), A(54, 1), A(54, 2)];
          const dctx = $('dots').getContext('2d');
          const lengths = branches.map((p) => p.getTotalLength());
          const room = (paint) => { const c = document.createElement('canvas'); c.width = 168; c.height = 104; paint(c.getContext('2d')); return c; };
          const [riau, risk] = await Promise.all([GV.loadImage('assets/sentinel/riau-plantation.jpg'), GV.loadImage('assets/solution/DMR/desktop/risk.jpg')]);
          const rooms = [
            room((r) => { // Workspace: window with top bar, layer panel, map
              r.fillStyle = '#F5F6F8'; r.fillRect(0, 0, 168, 104);
              r.drawImage(riau, 700, 700, 900, 560, 40, 12, 128, 92);
              r.fillStyle = '#FFFFFF'; r.fillRect(0, 12, 40, 92);
              r.fillStyle = '#E4E8EF'; for (let i = 0; i < 4; i++) r.fillRect(6, 20 + i * 10, 28, 5);
              r.fillStyle = '#032750'; r.fillRect(0, 0, 168, 12);
            }),
            room((r) => { // Data Enrichment: the profile card
              r.fillStyle = '#FFFFFF'; r.fillRect(0, 0, 168, 104);
              r.fillStyle = '#032750'; r.fillRect(10, 9, 70, 7);
              [0.8, 0.6, 0.45, 0.7, 0.35, 0.55].forEach((v, i) => {
                r.fillStyle = '#E4E8EF'; r.fillRect(10, 24 + i * 13, 50, 6); r.fillRect(68, 24 + i * 13, 90, 6);
                r.fillStyle = '#1FAFA1'; r.fillRect(68, 24 + i * 13, 90 * v, 6);
              });
            }),
            room((r) => { // Enterprise: the sector strip
              const [cx, cy, cw, ch] = GV.cleanCrop('assets/solution/DMR/desktop/risk.jpg');
              r.drawImage(risk, cx * risk.width, cy * risk.height, cw * risk.width, ch * risk.height * 0.62, 0, 0, 168, 104);
            }),
          ];
          const expoOut = (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k));
          const ROOM = { w: 168, h: 104, r: 8 }, BADGE = { w: 44, h: 44, r: 22 };
          const rnd5 = GV.seeded(11);
          const risers = branches.flatMap((_, i) => Array.from({ length: 24 }, () => ({ i, phase: rnd5(), speed: 0.25 + rnd5() * 0.2 })));
          const drawDots = (t) => {
            dctx.clearRect(0, 0, 1920, 1080);
            branches.forEach((p, i) => {
              const u = t - departs[i];
              if (u < 0 || u > TRAVEL + 0.2) return;
              const pop = expoOut(u / 0.2), fold = GV.since(u, 0.25, 0.25), climb = GV.since(u, 0.5, TRAVEL - 0.5, (k) => k * k * (3 - 2 * k));
              const pt = p.getPointAtLength(lengths[i] * (1 - climb));
              const box = GV.lerpRect({ x: 0, y: 0, ...ROOM }, { x: 0, y: 0, ...BADGE }, fold);
              const sc = pop * (0.6 + 0.4 * pop); // from nothing, so 106.0 still matches act 08's last frame
              const w = box.w * sc, h = box.h * sc;
              const cx = pt.x, cy = pt.y - (1 - climb) * 70 * (1 - fold);
              dctx.globalAlpha = u > TRAVEL ? 1 - (u - TRAVEL) / 0.2 : 1;
              // A comet tail in the product colour (up to 160 px of branch behind the badge) while it climbs.
              if (climb > 0 && climb < 1) {
                const tail = Math.min(160, lengths[i] * (1 - climb)), from = lengths[i] * (1 - climb);
                for (let s = 0; s < 16; s++) {
                  const a = p.getPointAtLength(from + (tail * s) / 16), b = p.getPointAtLength(from + (tail * (s + 1)) / 16);
                  dctx.strokeStyle = PRODUCTS[i][1];
                  dctx.globalAlpha = (1 - s / 16) * 0.9 * Math.min(1, climb * 8);
                  dctx.lineWidth = 10 * (1 - s / 16);
                  dctx.lineCap = 'round';
                  dctx.beginPath(); dctx.moveTo(a.x, a.y); dctx.lineTo(b.x, b.y); dctx.stroke();
                }
                dctx.globalAlpha = u > TRAVEL ? 1 - (u - TRAVEL) / 0.2 : 1;
              }
              dctx.save();
              dctx.beginPath(); dctx.roundRect(cx - w / 2, cy - h / 2, w, h, box.r * sc); dctx.clip();
              dctx.globalAlpha *= 1 - fold;
              dctx.drawImage(rooms[i], cx - w / 2, cy - h / 2, w, h);
              dctx.restore();
              dctx.save();
              dctx.globalAlpha = (u > TRAVEL ? 1 - (u - TRAVEL) / 0.2 : 1) * fold;
              dctx.fillStyle = PRODUCTS[i][1];
              dctx.beginPath(); dctx.roundRect(cx - w / 2, cy - h / 2, w, h, box.r * sc); dctx.fill();
              dctx.lineWidth = 2.5; dctx.strokeStyle = '#FFFFFF'; dctx.stroke();
              dctx.restore();
              dctx.globalAlpha = 1;
            });
            // The hold: light keeps rising up every branch into the core.
            const on = GV.since(t, departs[2] + TRAVEL, 0.4);
            if (on > 0) {
              for (const r of risers) {
                const u = (r.phase + t * r.speed) % 1;
                const pt = branches[r.i].getPointAtLength(lengths[r.i] * (1 - u));
                dctx.globalAlpha = on * 0.9;
                dctx.fillStyle = '#FFFFFF';
                dctx.beginPath(); dctx.arc(pt.x, pt.y, 3.6, 0, Math.PI * 2); dctx.fill();
              }
              dctx.globalAlpha = 1;
            }
          };

          // Bar 56: the region, with links drawn once and nodes lighting one after another.
          const g = $('map').getContext('2d');
          const S = 0.72, OX = (1920 - 1920 * S) / 2, OY = 20;
          const at = ([x, y]) => [OX + x * S, OY + y * S];
          g.save();
          g.translate(OX, OY);
          g.scale(S, S);
          g.strokeStyle = 'rgba(228,232,239,0.32)';
          g.lineWidth = 1.4 / S;
          for (const [, d] of GV.SEA_SVG.matchAll(/ d="([^"]+)"/g)) g.stroke(new Path2D(d));
          g.restore();
          const rnd = GV.seeded(9);
          const COLORS = PRODUCTS.map(([, c]) => c);
          const nodes = Array.from({ length: 60 }, () => at(GV.SEA_POINTS[Math.floor(rnd() * GV.SEA_POINTS.length)]));
          // Links between neighbouring nodes light up with the nodes, as one network.
          const links = [];
          for (const [i, a] of nodes.entries()) {
            const near = nodes.map((b, j) => [Math.hypot(a[0] - b[0], a[1] - b[1]), j]).filter(([, j]) => j !== i).sort((p, q) => p[0] - q[0]).slice(0, 2);
            for (const [, j] of near) links.push([a, nodes[j]]);
          }
          const nctx = $('nodes').getContext('2d');
          const lightFrom = A(56);
          const drawNodes = (t) => {
            nctx.clearRect(0, 0, 1920, 1080);
            if (t >= lightFrom) {
              nctx.strokeStyle = `rgba(255,255,255,${(0.22 + 0.55 * Math.exp(-(t - lightFrom) * 5)).toFixed(3)})`;
              nctx.lineWidth = 1.6;
              nctx.beginPath();
              for (const [a, b] of links) { nctx.moveTo(...a); nctx.lineTo(...b); }
              nctx.stroke();
            }
            for (const [i, [x, y]] of nodes.entries()) {
              if (t < lightFrom) continue;
              const k = 1, pop = 1 + 0.6 * Math.exp(-(t - lightFrom) * 8);
              const c = COLORS[i % 3];
              nctx.globalAlpha = k;
              const R = 22 * pop;
              const halo = nctx.createRadialGradient(x, y, 0, x, y, R);
              halo.addColorStop(0, `${c}AA`);
              halo.addColorStop(1, `${c}00`);
              nctx.fillStyle = halo;
              nctx.beginPath(); nctx.arc(x, y, R, 0, Math.PI * 2); nctx.fill();
              nctx.fillStyle = '#FFFFFF';
              nctx.beginPath(); nctx.arc(x, y, 3.2, 0, Math.PI * 2); nctx.fill();
              nctx.strokeStyle = c;
              nctx.lineWidth = 2;
              nctx.beginPath(); nctx.arc(x, y, 6, 0, Math.PI * 2); nctx.stroke();
            }
            nctx.globalAlpha = 1;
          };

          const apply = (t) => {
            const open = Math.min(1, Math.max(0, t / 0.6));
            curtain.set(open);
            $('curtain').style.visibility = open >= 1 ? 'hidden' : 'visible';
            drawDots(t);
            drawNodes(t);
            // A slow push on the diagram through the hold.
            gsap.set($('diagram'), { scale: 1 + 0.05 * GV.since(t, A(54, 2), A(56) - A(54, 2), (k) => k) });
          };
          const clock = { t: 0 };
          tl.to(clock, { t: 6, duration: 6, ease: 'none', onUpdate: () => apply(clock.t) }, 0);
          apply(0);

          // The core answers each arrival; bar 55 holds the whole architecture.
          gsap.set($('net'), { opacity: 0.35 });
          gsap.set([$('mark'), ...names], { opacity: 0, y: 12 });
          gsap.set($('core'), { opacity: 0.6 });
          departs.forEach((d) => {
            tl.fromTo($('core'), { boxShadow: '0 0 0 0 rgba(255,255,255,0.0)' }, { boxShadow: '0 0 36px 8px rgba(255,255,255,0.55)', duration: 0.12, immediateRender: false }, d + TRAVEL - 0.05);
            tl.to($('core'), { boxShadow: '0 0 0 0 rgba(255,255,255,0.0)', duration: 0.35 }, d + TRAVEL + 0.07);
          });
          tl.to($('core'), { opacity: 1, duration: 0.3 }, A(55));
          // The full chord on bar 55: one light pulse from the core.
          tl.set($('chord'), { opacity: 1 }, A(55));
          tl.to($('chord'), { opacity: 0, duration: 0.8, ease: 'power2.out' }, A(55) + 1 / 30);
          tl.to($('net'), { opacity: 1, duration: 0.4 }, A(55));
          tl.to([$('mark'), ...names], { opacity: 1, y: 0, duration: 0.45, stagger: 0.08, ease: 'expo.out' }, A(55));

          // Bar 56: the diagram dissolves into the map.
          gsap.set([$('map'), $('glow')], { opacity: 0 });
          tl.to($('diagram'), { opacity: 0, duration: 0.5, ease: 'power2.in' }, A(56) - 0.2);
          tl.to([$('map'), $('glow')], { opacity: 1, duration: 0.6 }, A(56) - 0.4);
          gsap.set($('one'), { opacity: 0, y: 20, filter: 'blur(10px)' });
          gsap.set($('many'), { opacity: 0, y: 14, filter: 'blur(4px)' }); // blur scaled to the 30 px line
          const sharp = { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.5, ease: 'expo.out' };
          tl.to($('one'), sharp, A(56) + 0.25);
          tl.to($('many'), sharp, A(56) + 0.75);
        }, 6);
      </script>
    </template>
  </body>
</html>
