<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act01-world-root { position: absolute; inset: 0; overflow: hidden; background: var(--light-gray); }
        #act01-world-dawn { position: absolute; inset: 0; }
        #act01-world-dawn canvas { width: 100%; height: 100%; display: block; }
        #act01-world-stage { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 30%; }
        #act01-world-plane {
          position: absolute; left: -140px; top: -170px; width: 2200px; height: 1240px;
          transform-origin: 50% 100%; transform: rotateX(48deg);
          -webkit-mask-image: linear-gradient(to top, #000 50%, transparent 78%);
          mask-image: linear-gradient(to top, #000 50%, transparent 78%);
        }
        #act01-world-signals { position: absolute; inset: 0; width: 100%; height: 100%; }
        #act01-world-line {
          position: absolute; left: 0; right: 0; top: 392px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 64px; letter-spacing: 0.02em;
          color: var(--navy);
        }
      </style>
      <div id="act01-world-root" data-composition-id="act01-world" data-width="1920" data-height="1080">
        <div id="act01-world-dawn"></div>
        <div id="act01-world-stage">
          <div id="act01-world-plane">
            <canvas id="act01-world-signals" width="2200" height="1240"></canvas>
          </div>
        </div>
        <div id="act01-world-line"></div>
      </div>
      <script>
        (async () => {
          const id = 'act01-world';
          document.getElementById(`${id}-line`).textContent = GV.COPY['world.line2'];

          const dawn = await GV.ditheredCanvas('assets/earth/dawn.png', 1920, 1080, { palette: 'landing', cell: 3 });
          document.getElementById(`${id}-dawn`).append(dawn);

          // Signal points share the 1920x1080 frame of sea.svg; the plane is 2200x1240
          // and the coast mask is fitted with `contain`, so scale both the same way.
          const canvas = document.getElementById(`${id}-signals`);
          const ctx = canvas.getContext('2d');
          const s = Math.min(2200 / 1920, 1240 / 1080);
          const ox = (2200 - 1920 * s) / 2, oy = (1240 - 1080 * s) / 2;
          ctx.save();
          ctx.translate(ox, oy);
          ctx.scale(s, s);
          ctx.strokeStyle = 'rgba(255,255,255,0.85)';
          ctx.lineWidth = 2.2 / s;
          ctx.shadowColor = 'rgba(255,255,255,0.8)';
          ctx.shadowBlur = 6;
          for (const [, d] of GV.SEA_SVG.matchAll(/ d="([^"]+)"/g)) ctx.stroke(new Path2D(d));
          ctx.restore();

          const rnd = GV.seeded(1);
          ctx.shadowBlur = 10;
          for (const [x, y] of GV.SEA_POINTS) {
            const teal = rnd() < 0.22;
            ctx.shadowColor = teal ? 'rgba(31,175,161,0.9)' : 'rgba(255,255,255,0.9)';
            ctx.fillStyle = teal ? '#1FAFA1' : '#FFFFFF';
            ctx.beginPath();
            ctx.arc(ox + x * s, oy + y * s, teal ? 4.6 : 3.4, 0, Math.PI * 2);
            ctx.fill();
          }

          const tl = gsap.timeline({ paused: true });
          window.__timelines["act01-world"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
