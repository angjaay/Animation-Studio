<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act10-final-root { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }
        #act10-final-dawn {
          position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 75%);
          mask-image: linear-gradient(to bottom, transparent 0%, #000 75%);
          opacity: 0.85;
        }
        #act10-final-dawn canvas { display: block; width: 100%; height: 100%; }
        #act10-final-contours { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        #act10-final-logo { position: absolute; left: 50%; top: 230px; width: 432px; height: 121px; margin-left: -216px; }
        #act10-final-logo svg { width: 100%; height: 100%; display: block; }
        #act10-final-tagline {
          position: absolute; left: 0; right: 0; top: 470px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 48px; letter-spacing: 0.04em; color: var(--white);
        }
        #act10-final-credits {
          position: absolute; left: 0; right: 0; bottom: 28px; text-align: center;
          font-family: var(--font-text); font-weight: 600; font-size: 15px; color: var(--white);
          text-shadow: 0 1px 6px rgba(3, 39, 80, 0.9);
        }
        #act10-final-url {
          position: absolute; left: 0; right: 0; top: 560px; text-align: center;
          font-family: var(--font-text); font-weight: 600; font-size: 24px; letter-spacing: 0.12em; color: var(--cool-gray);
        }
        #act10-final-full {
          position: absolute; left: 0; right: 0; top: 380px; text-align: center;
          font-family: var(--font-text); font-weight: 600; font-size: 26px; letter-spacing: 0.04em; color: var(--cool-gray);
        }
        .act10-final-phrase {
          position: absolute; left: 0; right: 0; top: 470px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 48px; letter-spacing: 0.04em; color: var(--white);
        }
        #act10-final-sweep {
          position: absolute; left: 50%; top: 170px; width: 640px; height: 240px; margin-left: -320px;
          background: linear-gradient(100deg, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0) 58%) no-repeat;
          background-size: 300% 100%;
          -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 40%, transparent 100%);
          mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 40%, transparent 100%);
        }
        #act10-final-black { position: absolute; inset: 0; background: #000; }
      </style>
      <div id="act10-final-root" data-composition-id="act10-final" data-width="1920" data-height="1080">
        <div id="act10-final-dawn"></div>
        <svg id="act10-final-contours" viewBox="0 0 1920 1080" data-layout-allow-overflow></svg>
        <div id="act10-final-logo"></div>
        <div id="act10-final-sweep"></div>
        <div id="act10-final-full"></div>
        <div id="act10-final-chain"></div>
        <div id="act10-final-tagline"></div>
        <div id="act10-final-url"></div>
        <div id="act10-final-credits"></div>
        <div id="act10-final-black"></div>
      </div>
      <script>
        GV.register('act10-final', async (tl) => {
          const id = 'act10-final';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          $('tagline').textContent = GV.COPY['final.tagline'];
          $('url').textContent = GV.COPY['final.url'];
          $('credits').textContent = GV.COPY['final.credits'];
          $('logo').innerHTML = GV.WORDMARK_DARK.replace(/id="([^"]+)"/g, `id="${id}-$1"`).replace(/url\(#([^)]+)\)/g, `url(#${id}-$1)`);

          // Soft topographic contours: seeded sine stacks, 8% white.
          const rnd = GV.seeded(10);
          const lines = [];
          for (let k = 0; k < 7; k++) {
            const y0 = 120 + k * 120, amp = 18 + rnd() * 26, f = 0.002 + rnd() * 0.002, ph = rnd() * 6.28;
            let d = '';
            for (let x = -20; x <= 1940; x += 20) d += `${x === -20 ? 'M' : 'L'}${x} ${(y0 + amp * Math.sin(x * f + ph) + 8 * Math.sin(x * f * 3.1 + ph * 2)).toFixed(1)} `;
            lines.push(`<path d="${d}" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>`);
          }
          $('contours').innerHTML = lines.join('');

          const dawn = await GV.ditheredCanvas('assets/earth/dawn.png', 1920, 420, { palette: 'landing', cell: 3, crop: [0, 0.32, 1, 0.42] });
          $('dawn').append(dawn);

          $('full').textContent = GV.COPY['reveal.full'];
          const phrases = GV.COPY['final.chain'].map((text) => {
            const el = document.createElement('div');
            el.className = `${id}-phrase`;
            el.textContent = text;
            $('chain').append(el);
            return el;
          });

          // Bar 57, the sting: the reverse logo settles and a soft band of light crosses it (the glyphs are white, so the band lives around them).
          gsap.set($('logo'), { opacity: 0, scale: 0.96 });
          tl.to($('logo'), { opacity: 1, duration: 0.25, ease: 'power2.out' }, 0);
          tl.to($('logo'), { scale: 1, duration: 1.6, ease: 'power3.out' }, 0);
          gsap.set($('sweep'), { backgroundPosition: '100% 0', opacity: 0 });
          tl.set($('sweep'), { opacity: 1 }, A(57) + 0.3);
          tl.to($('sweep'), { backgroundPosition: '0% 0', duration: 0.8, ease: 'power1.inOut' }, A(57) + 0.3);
          tl.set($('sweep'), { opacity: 0 }, A(57) + 1.1);
          const rise = { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' };
          gsap.set([$('full'), $('tagline'), $('url'), $('credits'), ...phrases], { opacity: 0, y: 16 });
          tl.to($('full'), rise, A(57, 2));

          // Bar 58: from location, to intelligence, to decision, 0.6 s apart. Bar 59: the tagline.
          phrases.forEach((el, i) => {
            const t = A(58) + i * 0.6;
            tl.to(el, { ...rise, duration: 0.3 }, t);
            tl.to(el, { opacity: 0, y: -12, duration: 0.2 }, i < phrases.length - 1 ? t + 0.6 - 0.2 : A(59) - 0.2);
          });
          tl.to($('tagline'), rise, A(59));

          // Bar 60: address and credits, then everything goes to black from 119.2 s.
          tl.to([$('url'), $('credits')], { ...rise, stagger: 0.15 }, A(60));
          gsap.set($('black'), { opacity: 0 });
          tl.to($('black'), { opacity: 1, duration: 0.8, ease: 'power1.in' }, A(60, 2) + 0.2);
          tl.to($('contours'), { y: -24, duration: 8, ease: 'none' }, 0);
        }, 8);
      </script>
    </template>
  </body>
</html>
