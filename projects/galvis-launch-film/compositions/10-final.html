<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act10-final-root { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }
        #act10-final-dawn {
          position: absolute; left: 0; right: 0; bottom: 0; height: 420px;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 75%);
          mask-image: linear-gradient(to bottom, transparent 0%, #000 75%);
          opacity: 0.85;
        }
        #act10-final-dawn canvas { display: block; width: 100%; height: 100%; }
        #act10-final-contours {
          position: absolute; inset: 0; width: 1920px; height: 1080px;
          /* The lines stay out of the lockup band, so they never cross the type. */
          -webkit-mask-image: linear-gradient(180deg, #000 0, #000 160px, transparent 220px, transparent 680px, #000 740px);
          mask-image: linear-gradient(180deg, #000 0, #000 160px, transparent 220px, transparent 680px, #000 740px);
        }
        #act10-final-converge { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        #act10-final-burst { position: absolute; left: 520px; top: 50px; width: 560px; height: 480px; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255, 255, 255, 0.95), rgba(31, 175, 161, 0.35) 40%, rgba(3, 39, 80, 0) 72%); }
        #act10-final-foot { position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: linear-gradient(180deg, rgba(3, 39, 80, 0), rgba(3, 39, 80, 0.82)); }
        #act10-final-logo { position: absolute; left: 50%; top: 230px; width: 432px; height: 121px; margin-left: -216px; }
        #act10-final-logo svg { width: 100%; height: 100%; display: block; }
        #act10-final-tagline {
          position: absolute; left: 0; right: 0; top: 470px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 48px; letter-spacing: 0.04em; color: var(--white);
        }
        #act10-final-credits {
          position: absolute; left: 0; right: 0; bottom: 28px; text-align: center;
          font-family: var(--font-text); font-weight: 600; font-size: 15px; color: var(--white);
          text-shadow: 0 1px 6px rgba(3, 39, 80, 0.9);
        }
        #act10-final-lockup { position: absolute; inset: 0; transform-origin: 960px 420px; }
        #act10-final-underline { position: absolute; left: 875px; top: 600px; width: 170px; height: 4px; border-radius: 2px; background: var(--teal); transform-origin: 50% 50%; }
        #act10-final-url {
          position: absolute; left: 0; right: 0; top: 560px; text-align: center;
          font-family: var(--font-text); font-weight: 600; font-size: 24px; letter-spacing: 0.12em; color: var(--cool-gray);
        }
        #act10-final-full {
          position: absolute; left: 0; right: 0; top: 380px; text-align: center;
          font-family: var(--font-text); font-weight: 600; font-size: 26px; letter-spacing: 0.04em; color: var(--cool-gray);
        }
        .act10-final-phrase {
          position: absolute; left: 0; right: 0; top: 470px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 48px; letter-spacing: 0.04em; color: var(--white);
        }
        #act10-final-sweep {
          position: absolute; left: 50%; top: 170px; width: 640px; height: 240px; margin-left: -320px;
          background: linear-gradient(100deg, rgba(255, 255, 255, 0) 42%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0) 58%) no-repeat;
          background-size: 300% 100%;
          -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 40%, transparent 100%);
          mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 40%, transparent 100%);
        }
        #act10-final-black { position: absolute; inset: 0; background: #000; }
      </style>
      <div id="act10-final-root" data-composition-id="act10-final" data-width="1920" data-height="1080">
        <div id="act10-final-dawn"></div>
        <svg id="act10-final-contours" viewBox="0 0 1920 1080" data-layout-allow-overflow></svg>
        <div id="act10-final-foot"></div>
        <div id="act10-final-burst"></div>
        <canvas id="act10-final-converge" width="1920" height="1080"></canvas>
        <div id="act10-final-lockup">
        <div id="act10-final-logo"></div>
        <div id="act10-final-sweep"></div>
        <div id="act10-final-full"></div>
        <div id="act10-final-chain"></div>
        <div id="act10-final-tagline"></div>
        <div id="act10-final-url"></div>
        <i id="act10-final-underline"></i>
        </div>
        <div id="act10-final-credits"></div>
        <div id="act10-final-black"></div>
      </div>
      <script>
        GV.register('act10-final', async (tl) => {
          const id = 'act10-final';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          $('tagline').textContent = GV.COPY['final.tagline'];
          $('url').textContent = GV.COPY['final.url'];
          $('credits').textContent = GV.COPY['final.credits'];
          $('logo').innerHTML = GV.WORDMARK_DARK.replace(/id="([^"]+)"/g, `id="${id}-$1"`).replace(/url\(#([^)]+)\)/g, `url(#${id}-$1)`);

          // Soft topographic contours (noise-contour-etch, #476): seeded sine stacks whose phases drift with
          // time, so the lines change shape rather than slide.
          const rnd = GV.seeded(10);
          const contourDefs = Array.from({ length: 7 }, (_, k) => ({ y0: 120 + k * 120, amp: 18 + rnd() * 26, f: 0.002 + rnd() * 0.002, ph: rnd() * 6.28, sp: 0.35 + rnd() * 0.3 }));
          $('contours').innerHTML = contourDefs.map(() => '<path fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>').join('');
          const contourPaths = [...$('contours').querySelectorAll('path')];
          const drawContours = (t) => contourDefs.forEach(({ y0, amp, f, ph, sp }, k) => {
            let d = '';
            const p = ph + t * sp, a = amp * (1 + 0.25 * Math.sin(t * 0.7 + k));
            for (let x = -20; x <= 1940; x += 20) d += `${x === -20 ? 'M' : 'L'}${x} ${(y0 + a * Math.sin(x * f + p) + 8 * Math.sin(x * f * 3.1 + p * 2)).toFixed(1)} `;
            contourPaths[k].setAttribute('d', d);
          });

          // Dawn earth, lightly dithered (spec: "ber-dither tipis"), screen-locked.
          const dawn = await GV.ditheredCanvas('assets/earth/dawn.png', 1920, 420, { palette: 'landing', cell: 3, resolve: 0.15, crop: [0, 0.32, 1, 0.42] });
          $('dawn').append(dawn);
          // The sun keeps rising under the lockup: the dawn resolves from 0.15 to 0.45 across the act, in steps of
          // 0.004 so every frame draws exactly its own step (redrawn when the step changes).
          let lastDawn = 0.15;
          const dawnAt = (t) => {
            const r = Math.round((0.15 + 0.3 * Math.min(1, t / 7.2)) / 0.004) * 0.004;
            if (r !== lastDawn) { dawn.layer.set({ resolve: r }); dawn.layer.draw(); lastDawn = r; }
          };
          // The frame clock goes on after the last await, so a failed asset load never leaves it calling into
          // code that was not reached.
          const clock = { t: 0 };
          tl.to(clock, { t: 8, duration: 8, ease: 'none', onUpdate: () => { drawContours(clock.t); dawnAt(clock.t); } }, 0);
          drawContours(0);

          $('full').textContent = GV.COPY['reveal.full'];
          const phrases = GV.COPY['final.chain'].map((text) => {
            const el = document.createElement('div');
            el.className = `${id}-phrase`;
            el.textContent = text;
            $('chain').append(el);
            return el;
          });

          // Bar 57, the sting: the three product lights fly in from the branch ends and meet in the mark on
          // 112.5; a white burst, and the lockup pops into place. Then a soft band of light crosses it (the
          // glyphs are white, so the band lives around them).
          const LANDS = 0.5, MARK = [804, 290];
          const COMETS = [[[420, 820], '2,74,188'], [[960, 820], '31,175,161'], [[1500, 820], '134,195,106']];
          const cctx = $('converge').getContext('2d');
          const converge = (t) => {
            cctx.clearRect(0, 0, 1920, 1080);
            if (t >= LANDS) return;
            const k = (u) => Math.pow(Math.min(1, Math.max(0, u / LANDS)), 2); // accelerating into the mark
            for (const [[x0, y0], rgb] of COMETS) {
              for (let s = 0; s < 14; s++) {
                const a = k(t - s * 0.02), b = k(t - (s + 1) * 0.02);
                cctx.strokeStyle = `rgba(${rgb},${(0.95 * (1 - s / 14)).toFixed(3)})`;
                cctx.lineWidth = 10 * (1 - s / 14);
                cctx.lineCap = 'round';
                cctx.beginPath();
                cctx.moveTo(x0 + (MARK[0] - x0) * a, y0 + (MARK[1] - y0) * a);
                cctx.lineTo(x0 + (MARK[0] - x0) * b, y0 + (MARK[1] - y0) * b);
                cctx.stroke();
              }
              const h = k(t);
              cctx.fillStyle = '#FFFFFF';
              cctx.beginPath(); cctx.arc(x0 + (MARK[0] - x0) * h, y0 + (MARK[1] - y0) * h, 7, 0, Math.PI * 2); cctx.fill();
            }
          };
          const sting = { t: 0 };
          tl.to(sting, { t: 1, duration: 1, ease: 'none', onUpdate: () => converge(sting.t) }, 0);
          converge(0);
          gsap.set($('burst'), { opacity: 0 });
          tl.set($('burst'), { opacity: 1 }, LANDS);
          tl.to($('burst'), { opacity: 0, duration: 0.6, ease: 'power2.out' }, LANDS + 1 / 30);
          gsap.set($('logo'), { opacity: 0, scale: 1.15 });
          tl.set($('logo'), { opacity: 1 }, LANDS);
          tl.to($('logo'), { scale: 1, duration: 0.6, ease: 'expo.out' }, LANDS);
          gsap.set($('sweep'), { backgroundPosition: '100% 0', opacity: 0 });
          tl.set($('sweep'), { opacity: 1 }, A(57) + 0.3);
          tl.to($('sweep'), { backgroundPosition: '0% 0', duration: 0.8, ease: 'power1.inOut' }, A(57) + 0.3);
          tl.set($('sweep'), { opacity: 0 }, A(57) + 1.1);
          const rise = { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' };
          gsap.set([$('full'), $('tagline'), $('url'), $('credits'), ...phrases], { opacity: 0, y: 16 });
          tl.to($('full'), rise, A(57, 2));

          // Bar 58: from location, to intelligence, to decision, one per beat. Bar 59: the tagline.
          phrases.forEach((el, i) => {
            const t = A(58, i);
            tl.to(el, { ...rise, duration: 0.3 }, t);
            tl.to(el, { opacity: 0, y: -12, duration: 0.15 }, i < phrases.length - 1 ? t + 0.5 - 0.15 : A(59) - 0.2);
          });
          tl.to($('tagline'), rise, A(59));

          // Bar 60: address and credits, then everything goes to black from 119.2 s.
          tl.to([$('url'), $('credits')], { ...rise, stagger: 0.15 }, A(60));
          // The address gets a teal underline drawn out from the centre on the beat.
          gsap.set($('underline'), { scaleX: 0 });
          tl.to($('underline'), { scaleX: 1, duration: 0.4, ease: 'expo.out' }, A(60));
          // A slow push on the whole lockup through the last two bars.
          tl.fromTo($('lockup'), { scale: 1 }, { scale: 1.03, duration: A(60, 2) + 0.2 - A(59), ease: 'none', immediateRender: false }, A(59));
          gsap.set($('black'), { opacity: 0 });
          tl.to($('black'), { opacity: 1, duration: 0.8, ease: 'power1.in' }, A(60, 2) + 0.2);

        }, 8);
      </script>
    </template>
  </body>
</html>
