<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act06-workspace-root { position: absolute; inset: 0; overflow: hidden; background: var(--cool-gray); }
        #act06-workspace-dark, #act06-workspace-arch { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
        #act06-workspace-clip { position: absolute; inset: 0; }
        #act06-workspace-win { position: absolute; left: 400px; top: 135px; width: 1440px; height: 810px; }
        #act06-workspace-bloom { position: absolute; left: 0; top: 0; border-radius: 50%; background: var(--light-gray); box-shadow: 0 0 30px 8px rgba(245, 246, 248, 0.6); }
        #act06-workspace-tag {
          position: absolute; left: 96px; top: 135px; font-family: var(--font-text); font-weight: 700; font-size: 18px;
          letter-spacing: 0.18em; color: var(--navy);
        }
        #act06-workspace-tag i { display: block; width: 64px; height: 4px; border-radius: 2px; background: var(--bright-navy); margin-top: 12px; }
        .act06-workspace-note {
          position: absolute; left: 96px; top: 190px; width: 270px; font-family: var(--font-text); font-weight: 600; font-size: 20px;
          line-height: 1.35; color: var(--text-body);
        }
        .act06-workspace-word {
          position: absolute; left: 140px; top: 945px; transform-origin: 0 0;
          font-family: var(--font-display); font-weight: 700; font-size: 86px; letter-spacing: 0.04em; color: var(--bright-navy); white-space: nowrap;
        }
        .act06-workspace-map { position: absolute; inset: 0; overflow: hidden; }
        .act06-workspace-map canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #act06-workspace-sweep {
          position: absolute; top: 0; bottom: 0; left: 0; width: 220px; opacity: 0;
          background: linear-gradient(90deg, rgba(2, 74, 188, 0), rgba(2, 74, 188, 0.28) 70%, rgba(255, 255, 255, 0.75) 100%);
        }
      </style>
      <div id="act06-workspace-root" data-composition-id="act06-workspace" data-width="1920" data-height="1080">
        <div id="act06-workspace-tag"></div>
        <div id="act06-workspace-sub" class="act06-workspace-note"></div>
        <div id="act06-workspace-position" class="act06-workspace-note"></div>
        <div id="act06-workspace-w0" class="act06-workspace-word"></div>
        <div id="act06-workspace-w1" class="act06-workspace-word"></div>
        <div id="act06-workspace-w2" class="act06-workspace-word"></div>
        <div id="act06-workspace-w3" class="act06-workspace-word"></div>
        <canvas id="act06-workspace-dark" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <div id="act06-workspace-arch" data-layout-allow-overflow></div>
        <div id="act06-workspace-clip"><div id="act06-workspace-win"></div></div>
        <div id="act06-workspace-bloom"></div>
      </div>
      <script>
        GV.register('act06-workspace', async (tl) => {
          const id = 'act06-workspace';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          $('tag').textContent = GV.COPY['products.workspace'];
          $('tag').append(document.createElement('i'));
          $('sub').textContent = GV.COPY['workspace.sub'];
          $('position').textContent = GV.COPY['workspace.position'];
          const words = GV.COPY['workspace.words'].map((w, i) => { $(`w${i}`).textContent = w; return $(`w${i}`); });
          const lerp = (a, b, k) => a + (b - a) * k;
          const smooth = (k) => { const c = Math.min(1, Math.max(0, k)); return c * c * (3 - 2 * c); };

          // Map area of the window is 1144x764 (1440 minus the 296 px layer panel, minus the 46 px top bar).
          const W = 1144, H = 764;
          const map = document.createElement('div');
          map.className = `${id}-map`;
          const base = await GV.ditheredCanvas('assets/sentinel/riau-plantation.jpg', W, H, { palette: 'brand', cell: 3, resolve: 0.3 });
          map.append(base);

          // Suitability surface painted over the plantation belt (in the zoomed frame): seeded blobs in three classes.
          const surf = document.createElement('canvas');
          surf.width = W; surf.height = H;
          const g = surf.getContext('2d');
          const rnd = GV.seeded(6);
          const CLASSES = [['31,175,161', 0.55], ['242,209,92', 0.45], ['232,112,91', 0.38]];
          for (let k = 0; k < 46; k++) {
            const [rgb, a] = CLASSES[k % 3];
            const x = 40 + rnd() * 560, y = 300 + rnd() * 440, r = 40 + rnd() * 70;
            const grad = g.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, `rgba(${rgb},${a})`);
            grad.addColorStop(1, `rgba(${rgb},0)`);
            g.fillStyle = grad;
            g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
          }
          g.strokeStyle = 'rgba(255,255,255,0.85)';
          g.lineWidth = 2;
          g.setLineDash([8, 6]);
          g.strokeRect(24, 280, 600, 470);
          map.append(surf);
          const sweep = document.createElement('div');
          sweep.id = `${id}-sweep`;
          map.append(sweep);

          const steps = GV.COPY['workspace.steps'].map((label) => ({ label, status: 'pending' }));
          const ui = GV.renderWorkspace($('win'), {
            platform: GV.COPY['workspace.platform'],
            region: GV.COPY['workspace.region'],
            layers: GV.COPY['workspace.layers'].map((name, i) => ({ name, glyph: i === 0 || i === 3 ? 'raster' : 'vector', active: true })),
            prompt: GV.COPY['workspace.prompt'],
            steps,
            insight: { title: GV.COPY['workspace.insight'].title, bars: GV.COPY['workspace.insight'].classes.map((label, i) => ({ label, value: [0.42, 0.33, 0.25][i] })) },
            map,
          }, { prefix: id });

          // The agent's run as a function of time: typing, then five steps finishing on 70, 71, 72, 73, 74.5 s.
          // Each step makes the map react; every UI change eases over 180 ms (GV.UI_EASE).
          const prompt = GV.COPY['workspace.prompt'];
          const typeFrom = A(34), typeTo = A(34) + prompt.length * 0.025;
          const doneAt = [A(36), A(36, 2), A(37), A(37, 2), A(38, 1)];
          const startAt = doneAt.map((d, i) => (i === 0 ? typeTo : doneAt[i - 1]));
          const UI = 0.18;
          const ZOOM = [0.12, 0.18, 0.72, 0.72];
          let lastCrop = '', lastResolve = -1;
          const apply = (t) => {
            ui.setTyped(Math.max(0, Math.min(prompt.length, Math.round((t - typeFrom) / 0.025))));
            // ASK to VISUALIZE: the agent panel lifts while it plans; it settles as the map takes over on 70.0.
            ui.setFocus(GV.since(t, A(34), 0.6) * (1 - GV.since(t, A(36) - 0.4, 0.6)));
            doneAt.forEach((d, i) => {
              if (t >= d) ui.setStep(i, 'done', GV.since(t, d, UI));
              else if (t >= startAt[i]) ui.setStep(i, 'running', GV.since(t, startAt[i], UI));
              else ui.setStep(i, 'pending');
            });
            // 1 · identify region: the map zooms in by redrawing the dither on a narrowing crop (never scaled).
            const z = smooth((t - startAt[0]) / (doneAt[0] - startAt[0]));
            // 4 · suitability: the imagery resolves while the surface is painted on.
            const resolve = 0.3 + 0.45 * smooth((t - startAt[3]) / (doneAt[3] - startAt[3]));
            // Before the zoom the map drifts slowly (a live view), redrawn on a moving crop.
            const drift = 0.05 * Math.min(1, t / startAt[0]);
            const from = [drift, drift * 0.6, 0.94, 0.94];
            const crop = [lerp(from[0], ZOOM[0], z), lerp(from[1], ZOOM[1], z), lerp(from[2], ZOOM[2], z), lerp(from[3], ZOOM[3], z)];
            const key = crop.map((v) => v.toFixed(4)).join();
            if (key !== lastCrop || Math.abs(resolve - lastResolve) > 1e-3) {
              base.layer.set({ crop, resolve }); base.layer.draw(); lastCrop = key; lastResolve = resolve;
            }
            // 2 · activate datasets: the dataset layers blink in the panel.
            const blink = t >= startAt[1] && t < doneAt[1] ? 0.5 + 0.5 * Math.cos((t - startAt[1]) * Math.PI * 4) : 0;
            ui.flashLayer(1, blink); ui.flashLayer(2, blink);
            ui.flashLayer(3, t >= doneAt[3] ? 1 - GV.since(t, doneAt[3] + 0.8, 0.6) : 0);
            // 3 · spatial analysis: a scan band crosses the map.
            const s3 = (t - startAt[2]) / (doneAt[2] - startAt[2]);
            sweep.style.opacity = s3 > 0 && s3 < 1 ? '1' : '0';
            sweep.style.transform = `translateX(${(lerp(-220, W, Math.min(1, Math.max(0, s3)))).toFixed(1)}px)`;
            surf.style.clipPath = `inset(0 ${((1 - smooth((t - startAt[3]) / (doneAt[3] - startAt[3]))) * 100).toFixed(2)}% 0 0)`;
            // 5 · summary: the insight card rises and its chart grows.
            ui.setInsight(t < startAt[4] ? 0 : smooth((t - startAt[4]) / 0.6));
          };

          // Opening (bar 32): act 05's last frame — navy, glow, a light disc at the left branch end — then the
          // disc opens into the window while the navy dissolves to Cool Gray in Bayer order.
          // Closing (bar 38): the window shrinks back into that disc, the navy returns and the architecture
          // appears with the middle branch lit (act 07 opens from there).
          const S = GV.CAM_END;
          const dark = GV.navyGlowCanvas(S);
          const curtainCtx = $('dark').getContext('2d');
          const H0 = GV.HANDOFF.workspace;
          // The navy opens radially from the disc: only a moving band is dithered, never the whole frame.
          const curtain = GV.mountCurtain($('dark'), curtainCtx.createPattern(dark, 'no-repeat'), 6, { origin: [H0.cx, H0.cy] });
          $('arch').innerHTML = GV.architectureSvg({ lit: 'enrichment', scale: S });

          const disc = { x: H0.cx - H0.r, y: H0.cy - H0.r, w: 2 * H0.r, h: 2 * H0.r, r: H0.r };
          const full = { x: 400, y: 135, w: 1440, h: 810, r: 16 };
          const OPEN_FROM = 0, OPEN = 1.1, CLOSE_FROM = A(38, 2), CLOSE = 0.5; // collapses into the disc on 75.5
          const clip = (rect) => `inset(${rect.y.toFixed(1)}px ${(1920 - rect.x - rect.w).toFixed(1)}px ${(1080 - rect.y - rect.h).toFixed(1)}px ${rect.x.toFixed(1)}px round ${rect.r.toFixed(1)}px)`;
          const frame = (t) => {
            const open = GV.since(t, OPEN_FROM, OPEN, (k) => 1 - Math.pow(1 - k, 3));
            const close = GV.since(t, CLOSE_FROM, CLOSE, (k) => k * k * k);
            const k = open * (1 - close);
            $('clip').style.clipPath = clip(GV.lerpRect(disc, full, k));
            const COLLAPSE = CLOSE_FROM + CLOSE;
            const bloom = Math.max(1 - GV.since(t, OPEN_FROM, 0.35), t >= COLLAPSE - 0.1 ? 1 : 0);
            Object.assign($('bloom').style, { left: `${disc.x}px`, top: `${disc.y}px`, width: `${disc.w}px`, height: `${disc.h}px`, opacity: String(bloom * (1 - GV.since(t, COLLAPSE + 0.15, 0.2))) });
            // The navy is back in one stroke as the window collapses, and the architecture appears.
            const navy = Math.max(1 - GV.since(t, 0.15, 0.85, (x) => x), t >= COLLAPSE ? 1 : GV.since(t, CLOSE_FROM + 0.1, 0.4, (x) => x) * 0.6);
            curtain.set(1 - navy);
            // Fully clear layers are hidden so they never sit over the copy.
            $('dark').style.visibility = navy > 0 ? 'visible' : 'hidden';
            $('arch').style.opacity = String(t >= COLLAPSE ? 0.6 + 0.4 * GV.since(t, COLLAPSE, 0.3) : 0);
            $('arch').style.visibility = t >= COLLAPSE ? 'visible' : 'hidden';
          };
          const clock = { t: 0 };
          tl.to(clock, { t: 14, duration: 14, ease: 'none', onUpdate: () => { apply(clock.t); frame(clock.t); } }, 0);
          apply(0); frame(0);

          gsap.set([$('tag'), $('sub'), $('position')], { opacity: 0, y: 16 });
          tl.to([$('tag'), $('sub')], { opacity: 1, y: 0, duration: 0.5, stagger: 0.15, ease: 'expo.out' }, A(33));
          tl.to($('sub'), { opacity: 0, duration: 0.3 }, A(38));
          tl.to($('position'), { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, A(38));
          tl.to([$('tag'), $('position')], { opacity: 0, duration: 0.3 }, CLOSE_FROM);

          // Ask, analyse, visualise, understand: one word per bar, landing on the bar line.
          words.forEach((w, i) => {
            gsap.set(w, { rotation: -90, x: 0, y: 60, opacity: 0 });
            tl.to(w, { y: 0, opacity: 1, duration: 0.45, ease: 'expo.out' }, A(34 + i));
            if (i < 3) tl.to(w, { y: -60, opacity: 0, duration: 0.3, ease: 'power2.in' }, A(35 + i) - 0.3);
          });
          tl.to(words[3], { opacity: 0, duration: 0.3 }, CLOSE_FROM);
        }, 14);
      </script>
    </template>
  </body>
</html>
