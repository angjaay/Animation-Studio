<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act06-workspace-root { position: absolute; inset: 0; overflow: hidden; background: var(--cool-gray); }
        #act06-workspace-win { position: absolute; left: 400px; top: 135px; width: 1440px; height: 810px; }
        #act06-workspace-tag {
          position: absolute; left: 96px; top: 135px; font-family: var(--font-text); font-weight: 700; font-size: 18px;
          letter-spacing: 0.18em; color: var(--navy);
        }
        #act06-workspace-tag i { display: block; width: 64px; height: 4px; border-radius: 2px; background: var(--bright-navy); margin-top: 12px; }
        #act06-workspace-word {
          position: absolute; left: 150px; top: 945px; transform-origin: 0 0; transform: rotate(-90deg);
          font-family: var(--font-display); font-weight: 700; font-size: 104px; letter-spacing: 0.04em; color: var(--bright-navy); white-space: nowrap;
        }
        .act06-workspace-map { position: absolute; inset: 0; }
        .act06-workspace-map canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      </style>
      <div id="act06-workspace-root" data-composition-id="act06-workspace" data-width="1920" data-height="1080">
        <div id="act06-workspace-tag"></div>
        <div id="act06-workspace-word"></div>
        <div id="act06-workspace-win"></div>
      </div>
      <script>
        (async () => {
          const id = 'act06-workspace';
          const tag = document.getElementById(`${id}-tag`);
          tag.textContent = GV.COPY['products.workspace'];
          tag.append(document.createElement('i'));
          document.getElementById(`${id}-word`).textContent = GV.COPY['workspace.words'][3];

          // Map area of the window is 1144x764 (1440 minus the 296 px layer panel, minus the 46 px top bar).
          const W = 1144, H = 764;
          const map = document.createElement('div');
          map.className = `${id}-map`;
          map.append(await GV.ditheredCanvas('assets/sentinel/riau-plantation.jpg', W, H, { palette: 'brand', cell: 3, resolve: 0.72 }));

          // Suitability surface painted over the plantation belt: seeded blobs in three classes.
          const surf = document.createElement('canvas');
          surf.width = W; surf.height = H;
          const g = surf.getContext('2d');
          const rnd = GV.seeded(6);
          const CLASSES = [['31,175,161', 0.55], ['242,209,92', 0.45], ['232,112,91', 0.38]];
          for (let k = 0; k < 46; k++) {
            const [rgb, a] = CLASSES[k % 3];
            const x = 40 + rnd() * 560, y = 300 + rnd() * 440, r = 40 + rnd() * 70;
            const grad = g.createRadialGradient(x, y, 0, x, y, r);
            grad.addColorStop(0, `rgba(${rgb},${a})`);
            grad.addColorStop(1, `rgba(${rgb},0)`);
            g.fillStyle = grad;
            g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
          }
          g.strokeStyle = 'rgba(255,255,255,0.85)';
          g.lineWidth = 2;
          g.setLineDash([8, 6]);
          g.strokeRect(24, 280, 600, 470);
          map.append(surf);

          GV.renderWorkspace(document.getElementById(`${id}-win`), {
            platform: GV.COPY['workspace.platform'],
            region: GV.COPY['workspace.region'],
            layers: GV.COPY['workspace.layers'].map((name, i) => ({ name, glyph: i === 0 || i === 3 ? 'raster' : 'vector', active: true, flash: i === 3 })),
            prompt: GV.COPY['workspace.prompt'],
            steps: GV.COPY['workspace.steps'].map((label, i) => ({ label, status: i < 4 ? 'done' : 'running' })),
            insight: { title: GV.COPY['workspace.insight'].title, bars: GV.COPY['workspace.insight'].classes.map((label, i) => ({ label, value: [0.42, 0.33, 0.25][i] })) },
            map,
          });

          const tl = gsap.timeline({ paused: true });
          window.__timelines["act06-workspace"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
