<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act04-core-root { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }
        #act04-core-glow { position: absolute; inset: 0; background: radial-gradient(circle at 960px 600px, rgba(2, 74, 188, 0.55), rgba(3, 39, 80, 0) 520px); }
        #act04-core-gl { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
        .act04-core-anchor { position: absolute; left: 0; top: 0; width: 0; height: 0; }
        #act04-core-name {
          position: absolute; left: 0; right: 0; top: 40px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 40px; letter-spacing: 0.2em; padding-left: 0.2em; color: var(--white);
        }
        #act04-core-label {
          position: absolute; left: 0; right: 0; top: 102px; text-align: center;
          font-family: var(--font-text); font-weight: 600; font-size: 24px; letter-spacing: 0.3em; padding-left: 0.3em; color: var(--cool-gray);
        }
        #act04-core-heart { position: absolute; left: -73px; top: -80px; width: 146px; height: 160px; filter: drop-shadow(0 0 28px rgba(255, 255, 255, 0.55)); }
        #act04-core-heart > div { position: absolute; inset: 0; }
        #act04-core-heart svg { width: 100%; height: 100%; display: block; }
        .act04-core-mod { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; }
        .act04-core-disc {
          position: absolute; inset: 0; border-radius: 50%; overflow: hidden; background: #0A3366;
          box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55), 0 0 24px rgba(31, 175, 161, 0.35);
        }
        .act04-core-disc canvas, .act04-core-disc svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        #act04-core-question {
          position: absolute; left: 50%; top: 52px; transform: translateX(-50%); white-space: nowrap;
          padding: 16px 28px; border-radius: 32px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.35);
          font-family: var(--font-text); font-weight: 600; font-size: 26px; color: var(--white);
        }
        #act04-core-packet {
          position: absolute; left: 0; top: 0; opacity: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #fff;
          box-shadow: 0 0 14px 6px rgba(255, 255, 255, 0.9), 0 0 40px 14px rgba(31, 175, 161, 0.6);
        }
        .act04-core-name {
          position: absolute; left: 50%; width: 260px; margin-left: -130px; text-align: center;
          font-family: var(--font-text); font-weight: 600; font-size: 19px; color: var(--white); line-height: 1.25;
        }
      </style>
      <div id="act04-core-root" data-composition-id="act04-core" data-width="1920" data-height="1080">
        <div id="act04-core-glow"></div>
        <canvas id="act04-core-gl" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <div id="act04-core-mods"></div>
        <div id="act04-core-name"></div>
        <div id="act04-core-label"></div>
        <div id="act04-core-heartpos" class="act04-core-anchor"><div id="act04-core-heart"></div></div>
        <div id="act04-core-question"></div>
        <div id="act04-core-packet"></div>
      </div>
      <script>
        GV.register('act04-core', async (tl) => {
          const id = 'act04-core';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          const root = document.getElementById(`${id}-root`);
          document.getElementById(`${id}-name`).textContent = GV.COPY['reveal.name'];
          document.getElementById(`${id}-label`).textContent = GV.COPY['core.label'];

          const parts = GV.logoParts('act04');
          const heart = document.getElementById(`${id}-heart`);
          for (const key of ['hexagon', 'arrow', 'plates']) {
            const layer = document.createElement('div');
            layer.innerHTML = parts[key];
            heart.append(layer);
          }

          const order = ['ai', 'data', 'eo', 'analytics', 'ml', 'decision'];
          // The chamber is a Three.js scene; the logo, module visuals and labels are DOM pinned to it.
          const chamber = GV3D.mountCoreScene({ canvas: $('gl'), count: order.length });

          const svg = (inner) => `<svg viewBox="0 0 124 124">${inner}</svg>`;
          const rnd = GV.seeded(4);
          const visuals = {
            ai: () => svg(GV.COPY['core.tokens'].map((w, i) =>
              `<rect x="${14 + i * 6}" y="${30 + i * 24}" width="${w.length * 8 + 14}" height="18" rx="9" fill="${i === 1 ? '#1FAFA1' : '#FFFFFF'}" fill-opacity="${i === 1 ? 1 : 0.9}"/>` +
              `<text x="${21 + i * 6}" y="${43 + i * 24}" font-family="Mulish" font-weight="700" font-size="11" fill="#032750">${w}</text>`).join('')),
            data: () => svg(Array.from({ length: 16 }, (_, k) => {
              const x = 22 + (k % 4) * 21, y = 22 + Math.floor(k / 4) * 21;
              return `<rect x="${x}" y="${y}" width="17" height="17" rx="3" fill="${['#024ABC', '#1FAFA1', '#86C36A', '#FFFFFF'][k % 4]}" fill-opacity="${(0.45 + rnd() * 0.55).toFixed(2)}"/>`;
            }).join('')),
            eo: async () => {
              // Left half true colour, right half a greenness index from the same pixels.
              const img = await GV.loadImage('assets/sentinel/riau-plantation.jpg');
              const c = document.createElement('canvas');
              c.width = 124; c.height = 124;
              const g = c.getContext('2d');
              g.drawImage(img, 700, 900, 520, 520, 0, 0, 124, 124);
              const d = g.getImageData(62, 0, 62, 124);
              for (let i = 0; i < d.data.length; i += 4) {
                const [r, gr] = [d.data[i], d.data[i + 1]];
                // Index ramp: dry yellow (#E8C860) to dense green (#3E8E4A).
                const v = Math.max(0, Math.min(1, ((gr - r) / (gr + r + 1)) * 3 + 0.3));
                d.data[i] = 232 - v * 170; d.data[i + 1] = 200 - v * 58; d.data[i + 2] = 96 - v * 22;
              }
              g.putImageData(d, 62, 0);
              g.fillStyle = '#FFFFFF';
              g.fillRect(61, 0, 2, 124);
              return c;
            },
            analytics: () => svg(
              [44, 34, 24].map((r, i) => `<circle cx="62" cy="62" r="${r}" fill="#1FAFA1" fill-opacity="${0.12 + i * 0.12}" stroke="#1FAFA1" stroke-width="1.2"/>`).join('') +
              [0, 1, 2, 3].map((k) => `<path d="M${8 + k * 4} ${86 - k * 18} C40 ${70 - k * 18}, 80 ${100 - k * 18}, 120 ${80 - k * 18}" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.2"/>`).join('') +
              '<circle cx="62" cy="62" r="5" fill="#FFFFFF"/>'),
            ml: () => svg(
              '<defs><linearGradient id="act04-core-prob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86C36A"/><stop offset="0.5" stop-color="#F2D15C"/><stop offset="1" stop-color="#E8705B"/></linearGradient></defs>' +
              [0, 1, 2].map((k) => `<path d="M24 ${46 - k * 9} L62 ${30 - k * 9} L100 ${46 - k * 9} L62 ${62 - k * 9} Z" fill="none" stroke="#FFFFFF" stroke-opacity="${0.4 + k * 0.2}" stroke-width="1.2"/>`).join('') +
              '<path d="M18 82 L62 62 L106 82 L62 102 Z" fill="url(#act04-core-prob)"/>'),
            decision: () => svg(
              '<path d="M14 92 L44 70 L70 84 L58 108 L22 108 Z" fill="#86C36A" fill-opacity="0.8"/>' +
              '<path d="M50 40 L84 30 L104 56 L76 70 Z" fill="#1FAFA1" fill-opacity="0.9"/>' +
              '<path d="M80 80 L108 74 L112 100 L88 104 Z" fill="#024ABC"/>' +
              '<text x="62" y="58" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="#FFFFFF">87</text>'),
          };

          const mods = [];
          for (const [i, key] of order.entries()) {
            const anchor = document.createElement('div');
            anchor.className = `${id}-anchor`;
            const mod = document.createElement('div');
            mod.className = `${id}-mod`;
            const disc = document.createElement('div');
            disc.className = `${id}-disc`;
            const v = await visuals[key]();
            if (typeof v === 'string') disc.innerHTML = v; else disc.append(v);
            const name = document.createElement('div');
            name.className = `${id}-name`;
            name.textContent = GV.COPY[`core.mod.${key}`];
            // Labels sit outside the ring: above the top module, below the others.
            name.style.top = i === 0 ? '-56px' : '136px';
            mod.append(disc, name);
            anchor.append(mod);
            $('mods').append(anchor);
            mods.push({ anchor, mod, disc });
          }

          // The whole chamber is a function of time: camera, orbit, glows, packet and the DOM pinned to it.
          const ease = (k) => (k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k));
          const lerp = (a, b, k) => a + (b - a) * k;
          const clamp01 = (k) => Math.min(1, Math.max(0, k));
          const STEP = order.map((_, k) => A(20 + k));
          const ARRIVE = 0.5, LEAVE = 1.1, HOME = 1.55;
          const state = (t) => {
            const fly = 1 - Math.pow(1 - clamp01(t / 1.6), 3);
            const back = ease((t - A(26)) / 1.4);
            const spinAt = (u) => -0.035 * Math.max(0, u - A(19, 2));
            return {
              time: t,
              camZ: lerp(9, 0, fly) + 1.4 * back,
              tilt: lerp(-0.5, 0, back) * ease((t - A(19)) / 1.2),
              spin: lerp(spinAt(Math.min(t, A(26))), 0, back),
              orbitScale: ease((t - A(19, 2)) / 0.6),
              glow: STEP.map((s) => (t < s + 0.45 ? 0 : 0.55 + 0.45 * Math.exp(-(t - s - 0.45) * 2.5)) + (t >= A(26) ? 0.45 * back : 0)),
              cable: STEP.map((s) => (t < s + LEAVE ? 0 : t < s + HOME ? 1 : 0.6) + (t >= A(26) ? 0.4 * back : 0)),
              core: Math.min(1, 0.4 + STEP.reduce((m, s) => m + (t >= s + HOME ? 0.6 * Math.exp(-(t - s - HOME) * 3) : 0), 0) + 0.6 * back),
            };
          };
          const REF = 6.14;
          const place = (el, [x, y, depth], extra = '') => {
            const k = Math.min(1.3, Math.max(0.75, REF / depth));
            el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${k.toFixed(3)})${extra}`;
          };
          const packet = $('packet');
          const apply = (t) => {
            const st = state(t);
            chamber.render(st);
            mods.forEach((m, i) => place(m.anchor, chamber.moduleScreen(i)));
            const [hx, hy] = chamber.coreScreen();
            $('heartpos').style.transform = `translate(${hx.toFixed(1)}px, ${hy.toFixed(1)}px)`;
            // The packet: down from the question to the module, then along its cable into the core.
            const k = STEP.findLastIndex((s) => t >= s && t < s + HOME);
            if (k < 0) { packet.style.opacity = '0'; return; }
            const u = t - STEP[k];
            let x, y;
            if (u < ARRIVE) {
              const e = ease(u / ARRIVE);
              const [mx, my] = chamber.moduleScreen(k);
              const cx = lerp(960, mx, 0.5), cy = Math.min(110, my) - 40;
              x = (1 - e) * (1 - e) * 960 + 2 * (1 - e) * e * cx + e * e * mx;
              y = (1 - e) * (1 - e) * 110 + 2 * (1 - e) * e * cy + e * e * my;
            } else if (u < LEAVE) {
              [x, y] = chamber.moduleScreen(k);
            } else {
              const e = Math.pow((u - LEAVE) / (HOME - LEAVE), 2);
              [x, y] = chamber.cableScreen(k, e);
            }
            packet.style.opacity = '1';
            packet.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
          };
          const clock = { t: 0 };
          tl.to(clock, { t: 18, duration: 18, ease: 'none', onUpdate: () => apply(clock.t) }, 0);
          apply(0);

          // Bar 18: from inside the hexagon the core settles; the header follows.
          gsap.set($('heart'), { scale: 6, opacity: 0.6 });
          tl.to($('heart'), { scale: 1, opacity: 1, duration: 1.4, ease: 'power3.out' }, A(18));
          gsap.set([$('name'), $('label')], { opacity: 0, y: -16 });
          tl.to([$('name'), $('label')], { opacity: 1, y: 0, duration: 0.5, stagger: 0.1 }, A(18, 2));

          // Bar 19: the header gives way to the question, typed; ring and modules arrive.
          tl.to([$('name'), $('label')], { opacity: 0, duration: 0.3 }, A(19));
          const q = GV.COPY['core.question'];
          const typed = { n: 0 };
          $('question').textContent = '';
          gsap.set($('question'), { opacity: 0 });
          tl.to($('question'), { opacity: 1, duration: 0.2 }, A(19));
          tl.to(typed, { n: q.length, duration: q.length * 0.03, ease: 'none', onUpdate: () => { $('question').textContent = q.slice(0, Math.round(typed.n)); } }, A(19));
          gsap.set(mods.map((m) => m.mod), { scale: 0.4, opacity: 0 });
          tl.to(mods.map((m) => m.mod), { scale: 1, opacity: 1, duration: 0.5, stagger: 0.1, ease: 'back.out(1.6)' }, A(19, 2));

          // Bars 20-25: one question runs the engine, one module per bar (the packet is placed by apply()).
          STEP.forEach((t0, k) => {
            tl.to(mods[k].mod, { scale: 1.15, duration: 0.3, ease: 'back.out(2)' }, t0 + 0.45);
            tl.to(mods[k].disc, { boxShadow: '0 0 0 3px #1FAFA1, 0 0 40px rgba(31,175,161,0.8)', duration: 0.3 }, t0 + 0.45);
            tl.to(mods[k].mod, { scale: 1, duration: 0.3 }, t0 + 1.7);
          });

          // Bar 26: every module lit together; the question leaves and the header returns.
          tl.to(mods.map((m) => m.mod), { scale: 1.06, duration: 0.4, stagger: 0.04 }, A(26));
          tl.to($('question'), { opacity: 0, duration: 0.3 }, A(26));
          tl.to([$('name'), $('label')], { opacity: 1, duration: 0.5, stagger: 0.1 }, A(26, 1));
        }, 18);
      </script>
    </template>
  </body>
</html>
