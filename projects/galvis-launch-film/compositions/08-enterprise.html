<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #act08-enterprise-root { position: absolute; inset: 0; overflow: hidden; background: var(--light-gray); }
        #act08-enterprise-tag {
          position: absolute; left: 96px; top: 80px; font-family: var(--font-text); font-weight: 700; font-size: 18px;
          letter-spacing: 0.18em; color: var(--navy);
        }
        #act08-enterprise-tag i { display: block; width: 64px; height: 4px; border-radius: 2px; background: var(--green); margin-top: 12px; }
        .act08-enterprise-head {
          position: absolute; left: 96px; top: 128px; font-family: var(--font-display); font-weight: 700; font-size: 60px; color: var(--navy); white-space: nowrap;
        }
        #act08-enterprise-sub { font-size: 48px; top: 140px; }
        .act08-enterprise-count { position: absolute; right: 96px; top: 150px; font-family: var(--font-mono); font-size: 20px; color: var(--text-muted); }
        #act08-enterprise-strip { position: absolute; left: 0; top: 236px; width: 1920px; height: 600px; overflow: hidden; background: var(--navy); }
        #act08-enterprise-strip canvas { position: absolute; left: 0; top: 0; display: block; }
        #act08-enterprise-beam {
          position: absolute; left: -2px; top: 0; width: 4px; height: 600px; background: #fff;
          box-shadow: 0 0 18px 6px rgba(255, 255, 255, 0.85), 0 0 60px 18px rgba(134, 195, 106, 0.55);
        }
        .act08-enterprise-label { position: absolute; right: 60px; top: 40px; }
        .act08-enterprise-legend { position: absolute; left: 60px; bottom: 36px; }
        .act08-enterprise-chain {
          position: absolute; left: 96px; right: 96px; top: 872px; height: 96px; background: #fff; border-radius: 16px;
          box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); display: flex; align-items: center; justify-content: center; gap: 28px;
          font-family: var(--font-text); font-weight: 600; font-size: 26px; color: var(--navy);
        }
        .act08-enterprise-chain span { display: inline-flex; align-items: center; gap: 14px; color: var(--text-muted); }
        .act08-enterprise-chain span.on, .act08-enterprise-chain span.done { color: var(--navy); }
        .act08-enterprise-chain span::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--cool-gray); }
        .act08-enterprise-chain span.done::before { background: var(--navy); border-color: var(--navy); }
        .act08-enterprise-chain span.on::before { background: var(--green); border-color: var(--green); box-shadow: 0 0 0 5px rgba(134, 195, 106, 0.25); }
        .act08-enterprise-chain svg { width: 22px; height: 22px; display: block; }
        #act08-enterprise-position {
          position: absolute; left: 0; right: 0; top: 500px; text-align: center;
          font-family: var(--font-display); font-weight: 700; font-size: 64px; color: var(--navy);
        }
        #act08-enterprise-dark { position: absolute; inset: 0; background: var(--navy); }
        #act08-enterprise-cables { position: absolute; inset: 0; width: 1920px; height: 1080px; }
        #act08-enterprise-mark { position: absolute; left: 860px; top: 430px; width: 200px; height: 219px; }
        #act08-enterprise-mark > div { position: absolute; inset: 0; }
        #act08-enterprise-mark svg { width: 100%; height: 100%; display: block; }
        .act08-enterprise-tile {
          position: absolute; width: 340px; height: 68px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; padding: 0 24px;
          border: 1.5px solid rgba(31, 175, 161, 0.55); background: rgba(255, 255, 255, 0.06);
          font-family: var(--font-text); font-weight: 600; font-size: 22px; color: #fff;
        }
      </style>
      <div id="act08-enterprise-root" data-composition-id="act08-enterprise" data-width="1920" data-height="1080">
        <div id="act08-enterprise-tag" data-layout-allow-occlusion></div>
        <div id="act08-enterprise-sub" class="act08-enterprise-head"></div>
        <div id="act08-enterprise-heads"></div>
        <div id="act08-enterprise-strip">
          <div id="act08-enterprise-beam"></div>
        </div>
        <div id="act08-enterprise-chains"></div>
        <div id="act08-enterprise-position"></div>
        <div id="act08-enterprise-dark">
          <svg id="act08-enterprise-cables" viewBox="0 0 1920 1080"></svg>
          <div id="act08-enterprise-mark"></div>
          <div id="act08-enterprise-tiles"></div>
        </div>
      </div>
      <script>
        GV.register('act08-enterprise', async (tl) => {
          const id = 'act08-enterprise';
          const A = (bar, beat) => GV.at(id, bar, beat);
          const $ = (s) => document.getElementById(`${id}-${s}`);
          const make = (tag, cls, host, text) => {
            const el = document.createElement(tag);
            if (cls) el.className = `${id}-${cls}`;
            if (text != null) el.textContent = text;
            host.append(el);
            return el;
          };
          $('tag').textContent = GV.COPY['products.enterprise'];
          $('tag').append(document.createElement('i'));
          $('sub').textContent = GV.COPY['enterprise.sub'];
          $('position').textContent = GV.COPY['enterprise.position'];

          // Ahead of the beam (right) the imagery is raw and dithered; behind it (left) the analysis layer is clear.
          const W = 1920, H = 600;
          const S = 'assets/solution';
          const clean = (p) => GV.cleanCrop(`${S}/${p}`);
          const raw = (src, crop) => GV.ditheredCanvas(src, W, H, { palette: 'brand', cell: 3, resolve: 0, crop });
          const clear = (src, crop) => GV.ditheredCanvas(src, W, H, { palette: 'brand', cell: 3, resolve: 1, crop });
          const RIAU = 'assets/sentinel/riau-plantation.jpg', MORO = 'assets/sentinel/morowali-mining.jpg';
          const MORO_CROP = [0, 0.45, 0.72, 0.36];

          // Mining has no solution map: environmental pressure is painted over the clear scene around the smelters.
          const pressure = async () => {
            const c = await clear(MORO, MORO_CROP);
            const g = c.getContext('2d');
            const rnd = GV.seeded(8);
            const cores = [[620, 500, 1], [1250, 300, 1], [900, 380, 0.7], [1500, 420, 0.5]];
            for (let k = 0; k < 40; k++) {
              const [cx, cy, w] = cores[k % cores.length];
              const x = cx + (rnd() - 0.5) * 420 * w, y = cy + (rnd() - 0.5) * 260 * w, r = 50 + rnd() * 90;
              const hot = Math.hypot(x - cx, y - cy) < 120;
              const rgb = hot ? '232,112,91' : rnd() < 0.5 ? '242,160,80' : '242,209,92';
              const grad = g.createRadialGradient(x, y, 0, x, y, r);
              grad.addColorStop(0, `rgba(${rgb},${hot ? 0.6 : 0.42})`);
              grad.addColorStop(1, `rgba(${rgb},0)`);
              g.fillStyle = grad;
              g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
            }
            return c;
          };

          const RAMP = {
            up: ['#E8705B', '#F2D15C', '#86C36A'],
            down: ['#86C36A', '#F2D15C', '#E8705B'],
            heat: ['#F2D15C', '#F2A050', '#E8705B'],
          };
          const SECTORS = GV.COPY['enterprise.sectors'];
          const sources = [
            [raw(RIAU, [0, 0.52, 0.62, 0.46]), clear(`${S}/AFS/desktop/precision.jpg`, clean('AFS/desktop/precision.jpg')), RAMP.up],
            [raw(RIAU, [0.3, 0.08, 0.7, 0.4]), clear(`${S}/DMR/desktop/risk.jpg`, clean('DMR/desktop/risk.jpg')), RAMP.down],
            [raw(MORO, MORO_CROP), pressure(), RAMP.heat],
            [raw(`${S}/ESRE/desktop/EnergyPotential-Desktop.jpg`, clean('ESRE/desktop/EnergyPotential-Desktop.jpg')), clear(`${S}/ESRE/desktop/SolarProperty-Desktop.jpg`, clean('ESRE/desktop/SolarProperty-Desktop.jpg')), RAMP.up],
          ];
          const chevron = '<svg viewBox="0 0 24 24"><path d="M8 4l8 8-8 8" fill="none" stroke="#1FAFA1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          const strip = $('strip');
          const sectors = [];
          for (const [k, [rawP, clearP, ramp]] of sources.entries()) {
            const copy = SECTORS[k];
            const [rawC, clearC] = await Promise.all([rawP, clearP]);
            const label = make('div', 'label', strip);
            GV.renderLabel(label, copy.label);
            const legend = make('div', 'legend', strip);
            GV.renderLegend(legend, { title: copy.legend.title, kind: 'gradient', stops: ramp.map((color, i) => ({
              color, label: i === 0 ? copy.legend.ends[0] : i === ramp.length - 1 ? copy.legend.ends[1] : undefined,
            })) });
            strip.insertBefore(rawC, $('beam'));
            strip.insertBefore(clearC, $('beam'));
            const name = make('div', 'head', $('heads'), copy.name);
            const count = make('div', 'count', $('heads'), `${String(k + 1).padStart(2, '0')} / ${String(SECTORS.length).padStart(2, '0')}`);
            const chain = make('div', 'chain', $('chains'));
            const steps = copy.chain.map((step, i) => {
              if (i) chain.insertAdjacentHTML('beforeend', chevron);
              return make('span', null, chain, step);
            });
            sectors.push({ start: A(48) + k * 2.25, rawC, clearC, label, legend, name, count, chain, steps });
          }

          // Three quick sectors over clean glimpses, then the positioning line.
          const FLASH = [['EBG/desktop/SiteSelection-Desktop.jpg'], ['EBG/desktop/Geomarketing-Desktop.jpg'], ['ESRE/desktop/Network-Desktop.jpg']];
          const flashFrom = A(48) + 4 * 2.25;
          const flashes = [];
          for (const [k, [p]] of FLASH.entries()) {
            const canvas = await clear(`${S}/${p}`, clean(p));
            strip.insertBefore(canvas, $('beam'));
            flashes.push({ start: flashFrom + k / 3, canvas, name: make('div', 'head', $('heads'), GV.COPY['enterprise.flash'][k]) });
          }
          const flashTo = flashFrom + 1;

          // Everything in the strip is a function of time: which pair shows, where the beam is, which chain step is live.
          const SWEEP_FROM = 0.2, SWEEP_TO = 2.1;
          const show = (el, on) => { el.style.visibility = on ? 'visible' : 'hidden'; };
          const apply = (t) => {
            const k = sectors.findLastIndex((s) => t >= s.start);
            const live = t < flashFrom ? Math.max(0, k) : -1;
            let x = 0;
            if (live >= 0 && t >= sectors[0].start) {
              const u = t - sectors[live].start;
              x = W * Math.min(1, Math.max(0, (u - SWEEP_FROM) / (SWEEP_TO - SWEEP_FROM)));
            }
            sectors.forEach((s, i) => {
              const on = i === live;
              [s.rawC, s.clearC, s.chain].forEach((el) => show(el, on));
              show(s.label, on && t >= s.start);
              show(s.legend, on && x > 520);
              s.clearC.style.clipPath = `inset(0 ${W - x}px 0 0)`;
              s.rawC.style.clipPath = `inset(0 0 0 ${x}px)`;
              const u = t - s.start;
              const stage = u >= SWEEP_TO ? 2 : x >= W / 2 ? 1 : 0;
              s.steps.forEach((el, j) => { el.className = j < stage ? 'done' : j === stage ? 'on' : ''; });
            });
            const f = t >= flashFrom && t < flashTo ? Math.min(2, Math.floor((t - flashFrom) * 3)) : -1;
            flashes.forEach((fl, i) => { show(fl.canvas, i === f); show(fl.name, i === f); });
            const beam = $('beam');
            show(beam, x > 0 && x < W);
            beam.style.transform = `translateX(${x}px)`;
          };
          const clock = { t: 0 };
          tl.to(clock, { t: 16, duration: 16, ease: 'none', onUpdate: () => apply(clock.t) }, 0);
          apply(0);

          // Bar 46: the tag and the line, over the first sector's raw strip.
          gsap.set([$('tag'), $('sub')], { opacity: 0, y: 16 });
          tl.to([$('tag'), $('sub')], { opacity: 1, y: 0, duration: 0.5, stagger: 0.15, ease: 'power3.out' }, A(46));
          tl.to($('sub'), { opacity: 0, y: -12, duration: 0.3 }, A(47));

          // Sector names and counters enter with each sector.
          sectors.forEach((s, i) => {
            gsap.set([s.name, s.count], { opacity: 0, y: 20 });
            tl.to([s.name, s.count], { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, s.start);
            tl.to([s.name, s.count], { opacity: 0, y: -12, duration: 0.2 }, i < 3 ? sectors[i + 1].start - 0.2 : flashFrom - 0.2);
          });
          gsap.set($('chains'), { opacity: 0 });
          tl.to($('chains'), { opacity: 1, duration: 0.3 }, A(48));
          tl.to([$('chains'), $('strip')], { opacity: 0, duration: 0.35 }, flashTo - 0.05);
          gsap.set($('position'), { opacity: 0, y: 24 });
          tl.to($('position'), { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }, A(53));

          // Bar 47, dark for a moment: seven systems are cabled into the hexagon one after another.
          const parts = GV.logoParts('act08');
          for (const key of ['hexagon', 'arrow', 'plates']) make('div', null, $('mark')).innerHTML = parts[key];
          const SYSTEMS = GV.COPY['enterprise.systems'];
          const cx = 960, cy = 540;
          const cables = [];
          SYSTEMS.forEach((label, i) => {
            const left = i < 4;
            const row = left ? i : i - 4;
            const rows = left ? 4 : 3;
            const y = cy + (row - (rows - 1) / 2) * 120;
            const tile = make('div', 'tile', $('tiles'), label);
            tile.style.left = `${left ? 200 : 1380}px`;
            tile.style.top = `${y - 34}px`;
            const x0 = left ? 540 : 1380, x1 = left ? cx - 110 : cx + 110;
            const d = `M${x0},${y} C${(x0 + x1) / 2},${y} ${(x0 + x1) / 2},${cy} ${x1},${cy}`;
            $('cables').insertAdjacentHTML('beforeend', `<path d="${d}" fill="none" stroke="#1FAFA1" stroke-width="2.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>`);
            cables.push({ tile, path: $('cables').lastElementChild, order: left ? row * 2 : row * 2 + 1 });
          });
          gsap.set($('dark'), { opacity: 0 });
          tl.to($('dark'), { opacity: 1, duration: 0.15 }, A(47));
          tl.to($('dark'), { opacity: 0, duration: 0.2 }, A(48) - 0.2);
          gsap.set($('mark'), { scale: 0.8, opacity: 0 });
          tl.to($('mark'), { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(1.6)' }, A(47));
          cables.forEach(({ tile, path, order }) => {
            const at = A(47) + 0.2 + order * 0.16;
            gsap.set(tile, { opacity: 0, x: 0 });
            gsap.set(path, { strokeDashoffset: 1 });
            tl.to(tile, { opacity: 1, duration: 0.2 }, at);
            tl.to(path, { strokeDashoffset: 0, duration: 0.3, ease: 'power2.out' }, at + 0.05);
            tl.to(tile, { borderColor: '#1FAFA1', backgroundColor: 'rgba(31,175,161,0.18)', duration: 0.15 }, at + 0.3);
          });
        }, 16);
      </script>
    </template>
  </body>
</html>
